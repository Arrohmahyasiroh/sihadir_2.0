<script>
// PAGE: ABSEN (USER)
async function pageAbsen() {
  // Satu panggilan gabungan (poin 1): menggantikan 2-3 panggilan berurutan sebelumnya.
  // Jika gagal (server/timeout), JANGAN biarkan spinner muter selamanya — tampilkan kartu error + tombol ulangi.
  let r;
  try {
    r = await callGAS('getRingkasanHariIni');
  } catch (err) {
    r = { success: false, message: (err && err.message) || String(err) };
  }
  if (!r || !r.success) {
    toast('Gagal memuat status absen: ' + ((r && r.message) || ''), 'error');
    document.getElementById('page-body').innerHTML = `
      <div class="card" style="text-align:center;padding:40px 24px;">
        <i class="fas fa-wifi fa-2x" style="color:var(--c-text-muted);margin-bottom:12px;"></i>
        <div style="font-weight:800;margin-bottom:6px;">Gagal memuat halaman Presensi</div>
        <div style="font-size:.82rem;color:var(--c-text-muted);margin-bottom:16px;">${escapeHtml((r && r.message) || 'Server tidak merespons. Periksa koneksi internet Anda.')}</div>
        <button class="btn btn-primary" onclick="showUserPage('absen')"><i class="fas fa-rotate-right"></i> Coba Lagi</button>
      </div>`;
    return;
  }
  statusAbsen = { masuk: r.masuk, pulang: r.pulang };
  const masukDone = r.masuk;
  const pulangDone = r.pulang;

  // Khusus guru: wajib isi laporan mengajar hari ini sebelum bisa absen pulang.
  const wajibLaporan = currentUser.role === 'user_guru';
  const pulangTerkunciLaporan = wajibLaporan && masukDone && !pulangDone && !r.sudahLaporan;
  const pulangDisabled = !masukDone || pulangDone || pulangTerkunciLaporan;

  document.getElementById('page-body').innerHTML = `
    <div class="absen-hero">
      <h2>Selamat Datang, ${currentUser.nama.split(' ')[0]}!</h2>
      <p>${currentUser.mapel} &nbsp;|&nbsp; NIP: ${currentUser.nip}</p>
      <div class="absen-btns">
        <button class="btn-absen btn-absen-masuk" onclick="doAbsenMasuk()" ${masukDone?'disabled':''}>
          <i class="fas fa-sign-in-alt"></i> ${masukDone?'Sudah Absen Masuk':'Absen Masuk'}
        </button>
        <button class="btn-absen btn-absen-pulang" onclick="doAbsenPulang()" ${pulangDisabled?'disabled':''} title="${pulangTerkunciLaporan?'Isi Laporan Mengajar terlebih dahulu':''}">
          <i class="fas fa-sign-out-alt"></i> ${pulangDone?'Sudah Absen Pulang':'Absen Pulang'}
        </button>
      </div>
      ${pulangTerkunciLaporan ? `<div class="absen-status-bar"><div class="absen-chip" style="background:rgba(198,40,40,.25);"><i class="fas fa-triangle-exclamation"></i> Isi Laporan Mengajar hari ini dulu sebelum absen pulang</div></div>` : ''}
      <div class="absen-status-bar">
        <div class="absen-chip ${masukDone?'ok':''}"><i class="fas fa-${masukDone?'check':'clock'}"></i> Masuk: ${r.waktuMasuk||'Belum'}</div>
        <div class="absen-chip ${pulangDone?'ok':''}"><i class="fas fa-${pulangDone?'check':'clock'}"></i> Pulang: ${r.waktuPulang||'Belum'}</div>
        ${masukDone?`<div class="absen-chip"><i class="fas fa-map-marker-alt"></i> ${r.lokasi||'—'}</div>`:''}
        ${masukDone?`<div class="absen-chip">${statusBadge(r.statusMasuk)}</div>`:''}
      </div>
    </div>
    <div class="card" style="margin-top:16px;padding:18px;border-radius:18px;box-shadow:0 6px 24px rgba(26,35,126,0.07);background:var(--c-surface);">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;padding-bottom:10px;border-bottom:1.5px solid var(--c-border);">
        <div style="font-size:.88rem;font-weight:800;color:var(--c-primary);display:flex;align-items:center;gap:8px;">
          <i class="fas fa-history" style="color:var(--c-primary);"></i> Riwayat Absensi 7 Hari Terakhir
        </div>
        <span style="font-size:.72rem;color:var(--c-text-muted);font-weight:600;background:var(--c-surface2);padding:2px 8px;border-radius:10px;border:1px solid var(--c-border);">7 Hari</span>
      </div>
      <div class="table-wrap" style="font-size:.8rem;">
        <table style="width:100%;border-collapse:collapse;">
          <thead>
            <tr style="background:var(--c-surface2);border-bottom:2px solid var(--c-border);">
              <th style="padding:9px 10px;text-align:left;font-size:.73rem;color:var(--c-text-muted);">Tanggal</th>
              <th style="padding:9px 10px;text-align:center;font-size:.73rem;color:var(--c-text-muted);">Masuk</th>
              <th style="padding:9px 10px;text-align:center;font-size:.73rem;color:var(--c-text-muted);">Pulang</th>
              <th style="padding:9px 10px;text-align:center;font-size:.73rem;color:var(--c-text-muted);">Status</th>
            </tr>
          </thead>
          <tbody>
            ${(r.riwayat7Hari && r.riwayat7Hari.length) ? r.riwayat7Hari.map((item, idx) => `
              <tr style="border-bottom:1px solid var(--c-border);${idx%2===1?'background:var(--c-surface2);':''}">
                <td style="padding:9px 10px;font-weight:600;white-space:nowrap;">
                  ${formatTgl(item.tanggal)}
                </td>
                <td style="padding:9px 10px;text-align:center;font-family:monospace;font-size:.82rem;">
                  ${item.waktuMasuk || '—'}
                </td>
                <td style="padding:9px 10px;text-align:center;font-family:monospace;font-size:.82rem;">
                  ${item.waktuPulang || '—'}
                </td>
                <td style="padding:9px 10px;text-align:center;">
                  ${statusBadge(item.status || item.statusMasuk || 'HADIR')}
                </td>
              </tr>
            `).join('') : `
              <tr>
                <td colspan="4" style="text-align:center;padding:24px 12px;color:var(--c-text-muted);font-size:.82rem;">
                  <i class="fas fa-inbox fa-2x" style="display:block;margin-bottom:6px;opacity:.3;"></i>
                  Belum ada riwayat absensi dalam 7 hari terakhir.
                </td>
              </tr>
            `}
          </tbody>
        </table>
      </div>
    </div>`;
}

function doAbsenMasuk() {
  if (!navigator.geolocation) { toast('Geolocation tidak didukung browser ini', 'error'); return; }
  toast('Mendapatkan lokasi Anda...', 'info', 2000);
  navigator.geolocation.getCurrentPosition(async pos => {
    const { latitude: lat, longitude: lng } = pos.coords;
    const res = await callGAS('absenMasuk', lat, lng);
    toast(res.message, res.success ? 'success' : 'error', 5000);
    if (res.success) { statusAbsen.masuk = true; setTimeout(() => showUserPage('absen'), 1500); }
  }, err => toast('Gagal mendapatkan lokasi: ' + err.message, 'error'));
}

function doAbsenPulang() {
  if (!navigator.geolocation) { toast('Geolocation tidak didukung', 'error'); return; }
  toast('Mendapatkan lokasi Anda...', 'info', 2000);
  navigator.geolocation.getCurrentPosition(async pos => {
    const { latitude: lat, longitude: lng } = pos.coords;
    const res = await callGAS('absenPulang', lat, lng);
    toast(res.message, res.success ? 'success' : 'error', 5000);
    if (res.success) { statusAbsen.pulang = true; setTimeout(() => showUserPage('absen'), 1500); }
  }, err => toast('Gagal mendapatkan lokasi: ' + err.message, 'error'));
}

// PAGE: LAPORAN MENGAJAR
let _sedangSimpanLaporan = false;   // pengunci klik ganda pada tombol Simpan

// Jam dari sheet bisa berupa "07:30" atau string ISO (data lama) → selalu tampil HH:mm
function fmtJam(v) {
  if (!v) return '—';
  const s = String(v);
  if (/^\d{1,2}:\d{2}$/.test(s)) return s;
  const d = new Date(s);
  return isNaN(d) ? '—' : fmt(d, 'HH:mm');
}

// Kartu error standar halaman user: dipakai saat server gagal, supaya spinner
// tidak muter selamanya (bug: beberapa page cuma `return` tanpa render apa-apa).
function userGagalHTML(judul, pesan, halaman) {
  return `
    <div class="card" style="text-align:center;padding:40px 24px;">
      <i class="fas fa-wifi fa-2x" style="color:var(--c-text-muted);margin-bottom:12px;"></i>
      <div style="font-weight:800;margin-bottom:6px;">${judul}</div>
      <div style="font-size:.82rem;color:var(--c-text-muted);margin-bottom:16px;">${escapeHtml(pesan || 'Server tidak merespons. Periksa koneksi internet Anda.')}</div>
      <button class="btn btn-primary" onclick="showUserPage('${halaman}')"><i class="fas fa-rotate-right"></i> Coba Lagi</button>
    </div>`;
}

async function pageLaporan() {
  _sedangSimpanLaporan = false;
  const akses = await callGAS('getStatusKunciHarian');
  if (!akses || !akses.success) {
    toast('Gagal memuat status akses: ' + ((akses && akses.message) || ''), 'error');
    document.getElementById('page-body').innerHTML = userGagalHTML('Gagal memuat Laporan Mengajar', (akses && akses.message) || '', 'laporan');
    return;
  }
  if (!akses.masuk) {
    document.getElementById('page-body').innerHTML = `
      <div class="card" style="text-align:center;padding:48px;">
        <i class="fas fa-lock fa-3x" style="color:var(--c-text-muted);margin-bottom:16px;"></i>
        <h3 style="color:var(--c-primary);margin-bottom:8px;">Akses Dibatasi</h3>
        <p style="color:var(--c-text-muted);">Anda harus melakukan <strong>absen masuk</strong> terlebih dahulu sebelum mengisi laporan mengajar.</p>
        <button class="btn btn-primary mt-3" onclick="showUserPage('absen')"><i class="fas fa-fingerprint"></i> Ke Halaman Absensi</button>
      </div>`;
    return;
  }
  if (akses.pulang) {
    document.getElementById('page-body').innerHTML = `
      <div class="card" style="text-align:center;padding:48px;">
        <i class="fas fa-circle-check fa-3x" style="color:var(--c-text-muted);margin-bottom:16px;"></i>
        <h3 style="color:var(--c-primary);margin-bottom:8px;">Hari Ini Sudah Selesai</h3>
        <p style="color:var(--c-text-muted);">Anda sudah absen pulang hari ini, jadi Laporan Mengajar tidak bisa diisi lagi. Hubungi admin bila Anda perlu mengisi data untuk hari ini.</p>
      </div>`;
    return;
  }
  if (akses.terkunciWaktu) {
    document.getElementById('page-body').innerHTML = `
      <div class="card" style="text-align:center;padding:48px;">
        <i class="fas fa-clock fa-3x" style="color:var(--c-text-muted);margin-bottom:16px;"></i>
        <h3 style="color:var(--c-primary);margin-bottom:8px;">Waktu Pengisian Sudah Ditutup</h3>
        <p style="color:var(--c-text-muted);">Laporan Mengajar untuk hari ini sudah ditutup sejak pukul <strong>${akses.jamKunci}</strong>. Hubungi admin bila Anda perlu mengisi data untuk hari ini.</p>
      </div>`;
    return;
  }
  const [data, opsi] = await Promise.all([
    callGAS('getDataUser', currentUser.id),
    callGAS('getOpsiLaporan')
  ]);
  if (!data.success) {
    toast('Gagal memuat data laporan', 'error');
    document.getElementById('page-body').innerHTML = userGagalHTML('Gagal memuat Laporan Mengajar', data.message || '', 'laporan');
    return;
  }
  const kelasList = (opsi && opsi.success) ? (opsi.kelas || []) : [];
  const mapelList = (opsi && opsi.success) ? (opsi.mapel || []) : [];
  const laporan = (data.laporan || []).slice(-10).reverse();
  const today = new Date().toISOString().split('T')[0];

  // Dropdown bila Master Data terisi; kalau kosong → kolom ketik bebas (guru tidak terkunci)
  const pilihan = (id, list, placeholder, terpilih, contoh) => list.length
    ? `<select id="${id}" class="form-input"><option value="">${placeholder}</option>${list.map(n => `<option value="${rwEsc(n)}" ${n === terpilih ? 'selected' : ''}>${rwEsc(n)}</option>`).join('')}</select>`
    : `<input type="text" id="${id}" class="form-input" value="${rwEsc(terpilih || '')}" placeholder="${contoh}"/>`;

  document.getElementById('page-body').innerHTML = `
    <div class="form-section mb-3">
      <div class="form-section-title"><i class="fas fa-plus-circle"></i> Input Laporan Mengajar</div>
      <div class="form-row cols-2">
        <div><label class="form-label">Tanggal</label><input type="date" id="l-tgl" class="form-input" value="${today}"/></div>
        <div><label class="form-label">Kelas</label>${pilihan('l-kelas', kelasList, '— Pilih kelas —', '', 'Contoh: X IPA 1')}</div>
      </div>
      <div class="form-row cols-2">
        <div><label class="form-label">Mata Pelajaran</label>${pilihan('l-mapel', mapelList, '— Pilih mata pelajaran —', currentUser.mapel || '', 'Mata pelajaran')}</div>
        <div><label class="form-label">Jam Mulai *</label><input type="time" id="l-mulai" class="form-input"/></div>
      </div>
      <div class="form-row"><div><label class="form-label">Jam Selesai *</label><input type="time" id="l-selesai" class="form-input"/></div></div>
      <button class="btn btn-primary" id="btn-simpan-laporan" onclick="submitLaporan()"><i class="fas fa-save"></i> Simpan Laporan</button>
    </div>
    <div class="card">
      <div class="card-title"><i class="fas fa-list"></i> Riwayat Laporan</div>
      <div class="table-wrap">
        <table>
          <tr><th>Tanggal</th><th>Kelas</th><th>Mapel</th><th>Jam</th></tr>
          ${laporan.length ? laporan.map(l => `
            <tr>
              <td>${fmt(l.Tanggal)}</td>
              <td>${l.Kelas||'—'}</td>
              <td>${l.Mapel||'—'}</td>
              <td>${fmtJam(l.JamMulai)} - ${fmtJam(l.JamSelesai)}</td>
            </tr>`).join('') : '<tr><td colspan="4" style="text-align:center;padding:20px;color:var(--c-text-muted);">Belum ada laporan</td></tr>'}
        </table>
      </div>
    </div>`;
}

async function submitLaporan() {
  if (_sedangSimpanLaporan) return;   // klik kedua diabaikan selama proses berjalan
  const d = { tanggal: document.getElementById('l-tgl').value, kelas: document.getElementById('l-kelas').value, mapel: document.getElementById('l-mapel').value, jamMulai: document.getElementById('l-mulai').value, jamSelesai: document.getElementById('l-selesai').value };
  if (!d.tanggal) { toast('Pilih tanggal!', 'warn'); return; }
  if (!d.kelas) { toast('Pilih kelas!', 'warn'); return; }
  if (!d.mapel) { toast('Pilih mata pelajaran!', 'warn'); return; }
  if (!d.jamMulai || !d.jamSelesai) { toast('Jam mulai dan jam selesai wajib diisi!', 'warn'); return; }
  if (d.jamSelesai <= d.jamMulai) { toast('Jam selesai harus lebih dari jam mulai!', 'warn'); return; }

  _sedangSimpanLaporan = true;
  const btn = document.getElementById('btn-simpan-laporan');
  if (btn) { btn.disabled = true; btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Menyimpan...'; }

  let res;
  try { res = await callGAS('submitLaporanMengajar', d); }
  catch (e) { res = { success: false, message: 'Koneksi gagal. Cek riwayat laporan sebelum mengirim ulang.' }; }

  toast(res.message, res.success ? 'success' : 'error', 5000);
  if (res.success) {
    setTimeout(() => showUserPage('laporan'), 1000);   // tombol tetap nonaktif sampai halaman dimuat ulang
  } else {
    _sedangSimpanLaporan = false;
    if (btn) { btn.disabled = false; btn.innerHTML = '<i class="fas fa-save"></i> Simpan Laporan'; }
  }
}

// PAGE: IZIN
async function pageIzin() {
  const data = await callGAS('getDataUser', currentUser.id);
  if (!data || !data.success) {
    toast('Gagal memuat data izin', 'error');
    document.getElementById('page-body').innerHTML = userGagalHTML('Gagal memuat Pengajuan Izin', (data && data.message) || '', 'izin');
    return;
  }
  const izin = (data.izin || []).slice(-10).reverse();
  const today = new Date().toISOString().split('T')[0];
  document.getElementById('page-body').innerHTML = `
    <div class="form-section mb-3">
      <div class="form-section-title"><i class="fas fa-file-medical-alt"></i> Ajukan Izin / Cuti / Dinas</div>
      <div class="form-row cols-2">
        <div><label class="form-label">Jenis Izin</label>
          <select id="iz-jenis" class="form-input">
            <option value="Sakit">Sakit</option>
            <option value="Izin Pribadi">Izin Pribadi</option>
            <option value="Cuti">Cuti</option>
            <option value="Tugas Dinas">Tugas Dinas</option>
            <option value="Rapat/Seminar">Rapat / Seminar</option>
            <option value="Lainnya">Lainnya</option>
          </select>
        </div>
        <div><label class="form-label">&nbsp;</label>
          <div style="padding-top:6px;font-size:.78rem;color:var(--c-text-muted);">⚠️ Jenis Tugas Dinas & Rapat memerlukan persetujuan admin</div>
        </div>
      </div>
      <div class="form-row cols-2">
        <div><label class="form-label">Tanggal Mulai</label><input type="date" id="iz-mulai" class="form-input" value="${today}"/></div>
        <div><label class="form-label">Tanggal Selesai</label><input type="date" id="iz-selesai" class="form-input" value="${today}"/></div>
      </div>
      <div class="form-row"><div><label class="form-label">Keterangan / Alasan</label><textarea id="iz-ket" class="form-input" rows="3" placeholder="Jelaskan alasan izin..."></textarea></div></div>
      <button class="btn btn-warning" onclick="submitIzinForm()"><i class="fas fa-paper-plane"></i> Kirim Pengajuan</button>
    </div>
    <div class="card">
      <div class="card-title"><i class="fas fa-clipboard-list"></i> Riwayat Pengajuan Izin</div>
      <div class="table-wrap">
        <table>
          <tr><th>Tanggal Pengajuan</th><th>Jenis</th><th>Periode</th><th>Keterangan</th><th>Status</th></tr>
          ${izin.length ? izin.map(i => `
            <tr>
              <td>${fmt(i.TanggalPengajuan)}</td>
              <td>${i.JenisIzin||'—'}</td>
              <td>${fmt(i.TanggalMulai)} - ${fmt(i.TanggalSelesai)}</td>
              <td style="max-width:140px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${i.Keterangan||'—'}</td>
              <td>${statusBadge(i.Status)}</td>
            </tr>`).join('') : '<tr><td colspan="5" style="text-align:center;padding:20px;color:var(--c-text-muted);">Belum ada pengajuan izin</td></tr>'}
        </table>
      </div>
    </div>`;
}

async function submitIzinForm() {
  const d = { jenisIzin: document.getElementById('iz-jenis').value, tglMulai: document.getElementById('iz-mulai').value, tglSelesai: document.getElementById('iz-selesai').value, keterangan: document.getElementById('iz-ket').value };
  if (!d.keterangan) { toast('Isi keterangan izin!', 'warn'); return; }
  const res = await callGAS('submitIzin', d);
  toast(res.message, res.success ? 'success' : 'error');
  if (res.success) setTimeout(() => showUserPage('izin'), 1000);
}

// PAGE: KEGIATAN
let _sedangSimpanKegiatan = false;   // pengunci klik ganda pada tombol Kirim

async function pageKegiatan() {
  _sedangSimpanKegiatan = false;
  const akses = await callGAS('getStatusKunciHarian');
  if (!akses || !akses.success) {
    toast('Gagal memuat status akses: ' + ((akses && akses.message) || ''), 'error');
    document.getElementById('page-body').innerHTML = userGagalHTML('Gagal memuat Kegiatan', (akses && akses.message) || '', 'kegiatan');
    return;
  }
  if (!akses.masuk) {
    document.getElementById('page-body').innerHTML = `
      <div class="card" style="text-align:center;padding:48px;">
        <i class="fas fa-lock fa-3x" style="color:var(--c-text-muted);margin-bottom:16px;"></i>
        <h3 style="color:var(--c-primary);margin-bottom:8px;">Akses Dibatasi</h3>
        <p style="color:var(--c-text-muted);">Anda harus melakukan <strong>absen masuk</strong> terlebih dahulu sebelum mengisi kegiatan.</p>
        <button class="btn btn-primary mt-3" onclick="showUserPage('absen')"><i class="fas fa-fingerprint"></i> Ke Halaman Absensi</button>
      </div>`;
    return;
  }
  if (akses.pulang) {
    document.getElementById('page-body').innerHTML = `
      <div class="card" style="text-align:center;padding:48px;">
        <i class="fas fa-circle-check fa-3x" style="color:var(--c-text-muted);margin-bottom:16px;"></i>
        <h3 style="color:var(--c-primary);margin-bottom:8px;">Hari Ini Sudah Selesai</h3>
        <p style="color:var(--c-text-muted);">Anda sudah absen pulang hari ini, jadi Kegiatan tidak bisa diisi lagi. Hubungi admin bila Anda perlu mengisi data untuk hari ini.</p>
      </div>`;
    return;
  }
  if (akses.terkunciWaktu) {
    document.getElementById('page-body').innerHTML = `
      <div class="card" style="text-align:center;padding:48px;">
        <i class="fas fa-clock fa-3x" style="color:var(--c-text-muted);margin-bottom:16px;"></i>
        <h3 style="color:var(--c-primary);margin-bottom:8px;">Waktu Pengisian Sudah Ditutup</h3>
        <p style="color:var(--c-text-muted);">Kegiatan untuk hari ini sudah ditutup sejak pukul <strong>${akses.jamKunci}</strong>. Hubungi admin bila Anda perlu mengisi data untuk hari ini.</p>
      </div>`;
    return;
  }
  const [data, opsi] = await Promise.all([
    callGAS('getDataUser', currentUser.id),
    callGAS('getOpsiKegiatan')
  ]);
  if (!data || !data.success) {
    toast('Gagal memuat data kegiatan', 'error');
    document.getElementById('page-body').innerHTML = userGagalHTML('Gagal memuat Kegiatan', (data && data.message) || '', 'kegiatan');
    return;
  }
  const kegiatanList = (opsi && opsi.success) ? (opsi.kegiatan || []) : [];
  const kegiatan = (data.kegiatan || []).slice(-10).reverse();
  const today = new Date().toISOString().split('T')[0];

  const pilihanKegiatan = kegiatanList.length
    ? `<select id="kg-nama" class="form-input"><option value="">— Pilih kegiatan —</option>${kegiatanList.map(n => `<option value="${rwEsc(n)}">${rwEsc(n)}</option>`).join('')}</select>`
    : `<input type="text" id="kg-nama" class="form-input" placeholder="Nama kegiatan..."/>`;

  document.getElementById('page-body').innerHTML = `
    <div class="form-section mb-3">
      <div class="form-section-title"><i class="fas fa-calendar-plus"></i> Kegiatan</div>
      <div class="form-row cols-2">
        <div><label class="form-label">Kegiatan</label>${pilihanKegiatan}</div>
        <div><label class="form-label">Tanggal Kegiatan</label><input type="date" id="kg-tgl" class="form-input" value="${today}"/></div>
      </div>
      <div class="form-row"><div><label class="form-label">Lokasi</label><input type="text" id="kg-lokasi" class="form-input" placeholder="Lokasi pelaksanaan"/></div></div>
      <div class="form-row"><div><label class="form-label">Deskripsi Kegiatan</label><textarea id="kg-desc" class="form-input" rows="3" placeholder="Uraikan kegiatan yang akan dilakukan..."></textarea></div></div>
      <button class="btn btn-accent" id="btn-kirim-kegiatan" onclick="submitKegiatanForm()"><i class="fas fa-paper-plane"></i> Simpan Kegiatan</button>
    </div>
    <div class="card">
      <div class="card-title"><i class="fas fa-list-check"></i> Riwayat Kegiatan</div>
      <div class="table-wrap">
        <table>
          <tr><th>Tanggal</th><th>Kegiatan</th><th>Lokasi</th></tr>
          ${kegiatan.length ? kegiatan.map(k => `
            <tr>
              <td>${fmt(k.TanggalKegiatan)}</td>
              <td>${k.NamaKegiatan||'—'}</td>
              <td>${k.Lokasi||'—'}</td>
            </tr>`).join('') : '<tr><td colspan="3" style="text-align:center;padding:20px;color:var(--c-text-muted);">Belum ada kegiatan</td></tr>'}
        </table>
      </div>
    </div>`;
}

async function submitKegiatanForm() {
  if (_sedangSimpanKegiatan) return;   // klik kedua diabaikan selama proses berjalan
  const d = { namaKegiatan: document.getElementById('kg-nama').value, tanggal: document.getElementById('kg-tgl').value, lokasi: document.getElementById('kg-lokasi').value, deskripsi: document.getElementById('kg-desc').value };
  if (!d.tanggal) { toast('Pilih tanggal!', 'warn'); return; }
  if (!d.namaKegiatan) { toast('Pilih kegiatan!', 'warn'); return; }

  _sedangSimpanKegiatan = true;
  const btn = document.getElementById('btn-kirim-kegiatan');
  if (btn) { btn.disabled = true; btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Menyimpan...'; }

  let res;
  try { res = await callGAS('submitKegiatan', d); }
  catch (e) { res = { success: false, message: 'Koneksi gagal. Cek riwayat kegiatan sebelum mengirim ulang.' }; }

  toast(res.message, res.success ? 'success' : 'error', 5000);
  if (res.success) {
    setTimeout(() => showUserPage('kegiatan'), 1000);   // tombol tetap nonaktif sampai halaman dimuat ulang
  } else {
    _sedangSimpanKegiatan = false;
    if (btn) { btn.disabled = false; btn.innerHTML = '<i class="fas fa-paper-plane"></i> Simpan Kegiatan'; }
  }
}

// PAGE: RIWAYAT (USER) — tab Presensi & Aktivitas
const RW_HARI  = ['Minggu','Senin','Selasa','Rabu','Kamis','Jumat','Sabtu'];
const RW_BULAN = ['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];
const RW_AKSI  = {
  ABSEN_MASUK:        ['Absen masuk',        'fa-sign-in-alt',        '#1565c0'],
  ABSEN_PULANG:       ['Absen pulang',       'fa-sign-out-alt',       '#00897b'],
  LAPORAN_MENGAJAR:   ['Laporan mengajar',   'fa-chalkboard-teacher', '#00897b'],
  PENGAJUAN_IZIN:     ['Pengajuan izin',     'fa-file-alt',           '#f57f17'],
  PENGAJUAN_KEGIATAN: ['Pengajuan kegiatan', 'fa-calendar-check',     '#6a1b9a'],
  UPDATE_PROFIL:      ['Perubahan profil',   'fa-user-cog',           '#c62828']
};
let riwayatState = { tab: 'presensi', data: null };

function rwEsc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]));
}
function rwTanggal(iso) {
  const [y, m, d] = String(iso).split('-').map(Number);
  return { hari: RW_HARI[new Date(y, m - 1, d).getDay()], tgl: d, bulan: RW_BULAN[m - 1] };
}
function rwKosong(msg) {
  return `<div style="text-align:center;padding:36px 16px;color:var(--c-text-muted);font-size:.88rem;">${msg}</div>`;
}

async function pageRiwayat() {
  const now = new Date();
  const thn = now.getFullYear();
  riwayatState = { tab: 'presensi', data: null };
  document.getElementById('page-body').innerHTML = `
    <div class="rw-filter">
      <select id="rw-bulan" class="form-input" onchange="loadRiwayat()">
        ${RW_BULAN.map((n, i) => `<option value="${i+1}" ${i === now.getMonth() ? 'selected' : ''}>${n}</option>`).join('')}
      </select>
      <select id="rw-tahun" class="form-input" onchange="loadRiwayat()">
        ${[thn-2, thn-1, thn].map(y => `<option value="${y}" ${y === thn ? 'selected' : ''}>${y}</option>`).join('')}
      </select>
    </div>
    <div class="rw-tabs">
      <button class="rw-tab active" id="rw-tab-presensi" onclick="setRiwayatTab('presensi')"><i class="fas fa-fingerprint"></i> Presensi</button>
      <button class="rw-tab" id="rw-tab-aktivitas" onclick="setRiwayatTab('aktivitas')"><i class="fas fa-history"></i> Aktivitas</button>
    </div>
    <div id="rw-unduh" class="mb-3" style="display:none;">
      <button class="btn btn-accent btn-sm" onclick="unduhPresensiCSV()"><i class="fas fa-file-csv"></i> Unduh Rekap Presensi (CSV)</button>
    </div>
    <div id="rw-body"></div>`;
  await loadRiwayat();
}

async function loadRiwayat() {
  const body = document.getElementById('rw-body');
  if (!body) return;
  const bulan = parseInt(document.getElementById('rw-bulan').value);
  const tahun = parseInt(document.getElementById('rw-tahun').value);
  body.innerHTML = '<div style="text-align:center;padding:30px;color:var(--c-text-muted);"><i class="fas fa-spinner fa-spin fa-2x"></i></div>';
  const res = await callGAS('getRiwayatUser', bulan, tahun);
  if (!document.getElementById('rw-body')) return; // user sudah pindah halaman
  if (!res.success) {
    document.getElementById('rw-body').innerHTML = rwKosong('Riwayat gagal dimuat. Ganti bulan atau muat ulang halaman untuk mencoba lagi.');
    toast('Gagal memuat riwayat: ' + (res.message || ''), 'error');
    return;
  }
  riwayatState.data = res;
  renderRiwayat();
}

function setRiwayatTab(tab) {
  riwayatState.tab = tab;
  renderRiwayat();
}

function renderRiwayat() {
  const { tab, data } = riwayatState;
  if (!data || !document.getElementById('rw-body')) return;
  ['presensi', 'aktivitas'].forEach(t => document.getElementById('rw-tab-' + t).classList.toggle('active', t === tab));
  const unduhWrap = document.getElementById('rw-unduh');
  if (unduhWrap) unduhWrap.style.display = (tab === 'presensi' && (data.presensi || []).length) ? 'block' : 'none';
  document.getElementById('rw-body').innerHTML = tab === 'presensi'
    ? renderRiwayatPresensi(data.presensi || [])
    : renderRiwayatAktivitas(data.aktivitas || []);
}

// Unduh rekap presensi bulan yang sedang dilihat sebagai CSV (dipakai guru/tendik sebagai catatan pribadi)
function unduhPresensiCSV() {
  const data = riwayatState.data;
  const list = data && data.presensi;
  if (!list || !list.length) { toast('Tidak ada data presensi untuk diunduh!', 'warn'); return; }
  const bulan = parseInt(document.getElementById('rw-bulan').value);
  const tahun = parseInt(document.getElementById('rw-tahun').value);
  const bulanNama = RW_BULAN[bulan - 1];
  const ket = a => [a.statusMasuk === 'TERLAMBAT' ? 'Terlambat' : '', a.statusPulang === 'PULANG AWAL' ? 'Pulang Awal' : ''].filter(Boolean).join(' & ') || '-';
  const urut = list.slice().sort((a, b) => a.tanggal.localeCompare(b.tanggal));
  const judul = [[`REKAP PRESENSI — ${currentUser.nama}`], [`NIP: ${currentUser.nip || '-'}  |  Periode: ${bulanNama} ${tahun}`], []];
  const headers = ['TANGGAL', 'HARI', 'MASUK', 'PULANG', 'KETERANGAN'];
  const rows = urut.map(a => [a.tanggal.split('-').reverse().join('/'), rwTanggal(a.tanggal).hari, a.masuk || '-', a.pulang || '-', ket(a)]);
  const allRows = [...judul, headers, ...rows];
  const csvContent = allRows.map(row => row.map(cell => {
    const val = cell === undefined || cell === null ? '' : String(cell);
    return val.includes(',') || val.includes('"') || val.includes('\n') ? `"${val.replace(/"/g, '""')}"` : val;
  }).join(',')).join('\n');
  const BOM = '\uFEFF';
  const blob = new Blob([BOM + csvContent], { type: 'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = `Presensi_${currentUser.nama.replace(/\s+/g, '_')}_${bulanNama}_${tahun}.csv`;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
  toast('Rekap presensi berhasil diunduh!', 'success');
}

function renderRiwayatPresensi(list) {
  if (!list.length) return rwKosong('Belum ada presensi di bulan ini.<br>Pilih bulan lain untuk melihat riwayat sebelumnya.');
  const hadir = list.filter(a => a.masuk).length;
  const telat = list.filter(a => a.statusMasuk === 'TERLAMBAT').length;
  const awal  = list.filter(a => a.statusPulang === 'PULANG AWAL').length;
  const stat = (n, label, warna) => `<div class="rw-stat"><b style="color:${warna}">${n}</b><span>${label}</span></div>`;
  return `
    <div class="rw-stats">
      ${stat(hadir, 'Hadir', 'var(--c-primary)')}
      ${stat(telat, 'Terlambat', telat ? 'var(--c-danger)' : 'var(--c-text-muted)')}
      ${stat(awal, 'Pulang awal', awal ? 'var(--c-danger)' : 'var(--c-text-muted)')}
    </div>
    ${list.map(a => {
      const t = rwTanggal(a.tanggal);
      const ket = [];
      if (a.statusMasuk === 'TERLAMBAT') ket.push(statusBadge('TERLAMBAT'));
      if (a.statusPulang === 'PULANG AWAL') ket.push(statusBadge('PULANG AWAL'));
      return `
      <div class="rw-row">
        <div class="rw-date"><b>${t.tgl}</b><span>${t.hari.slice(0, 3)}</span></div>
        <div class="rw-time"><span>Masuk</span><b>${a.masuk || '—'}</b></div>
        <div class="rw-time"><span>Pulang</span><b>${a.pulang || '—'}</b></div>
        <div class="rw-ket">${ket.join('') || '<span class="rw-ok">—</span>'}</div>
      </div>`;
    }).join('')}`;
}

function rwHumanize(aksi) {
  const s = String(aksi || '').toLowerCase().replace(/_/g, ' ').trim();
  return s ? s.charAt(0).toUpperCase() + s.slice(1) : '—';
}

// PAGE: PROFIL & PASSWORD (USER)
// Dipindah ke sini dari js-admin.html supaya menu Profil tidak hilang
// ("pageProfil is not defined") saat file admin belum/tidak ter-load.
async function pageProfil() {
  const u = currentUser;
  document.getElementById('page-body').innerHTML = `
    <div style="max-width:560px;margin:0 auto;">
      <div class="form-section mb-3">
        <div class="form-section-title"><i class="fas fa-id-card"></i> Data Profil</div>
        <div style="display:flex;align-items:center;gap:12px;margin-bottom:16px;">
          <div style="width:48px;height:48px;border-radius:50%;background:linear-gradient(135deg,var(--c-primary),var(--c-accent));display:flex;align-items:center;justify-content:center;color:#fff;font-size:1.3rem;font-weight:700;">
            ${u.nama ? u.nama.charAt(0).toUpperCase() : '?'}
          </div>
          <div>
            <div style="font-weight:700;">${u.nama}</div>
            <div style="font-size:.78rem;color:var(--c-text-muted);">${u.email} &nbsp;·&nbsp; ${u.role === 'admin' ? 'Administrator' : u.role === 'user_guru' ? 'Guru Pengajar' : 'Tenaga Pendidik'}</div>
          </div>
        </div>
        <div class="form-row cols-2">
          <div><label class="form-label">Nama Lengkap</label>
            <input type="text" id="pr-nama" class="form-input" value="${u.nama || ''}"/>
          </div>
          <div><label class="form-label">NIP</label>
            <input type="text" id="pr-nip" class="form-input" value="${u.nip || ''}" placeholder="Nomor Induk Pegawai"/>
          </div>
        </div>
        <div class="form-row">
          <label class="form-label">Mata Pelajaran / Jabatan</label>
          <input type="text" id="pr-mapel" class="form-input" value="${u.mapel || ''}" placeholder="Misal: Matematika"/>
        </div>
        <button class="btn btn-primary" onclick="simpanProfil()"><i class="fas fa-save"></i> Simpan Perubahan Profil</button>
      </div>
      <div class="form-section">
        <div class="form-section-title"><i class="fas fa-lock"></i> Ganti Password</div>
        <div class="form-row">
          <label class="form-label">Password Lama</label>
          <input type="password" id="pr-pw-lama" class="form-input" placeholder="Password saat ini"/>
        </div>
        <div class="form-row cols-2">
          <div><label class="form-label">Password Baru</label>
            <input type="password" id="pr-pw-baru" class="form-input" placeholder="Min. 6 karakter"/>
          </div>
          <div><label class="form-label">Konfirmasi Password Baru</label>
            <input type="password" id="pr-pw-konfirm" class="form-input" placeholder="Ulangi password baru"/>
          </div>
        </div>
        <button class="btn btn-warning" onclick="simpanPassword()"><i class="fas fa-key"></i> Ganti Password</button>
      </div>
    </div>`;
}

function renderRiwayatAktivitas(list) {
  if (!list.length) return rwKosong('Belum ada aktivitas di bulan ini.<br>Pilih bulan lain untuk melihat jejak sebelumnya.');
  const grup = {};
  list.forEach(l => (grup[l.tanggal] = grup[l.tanggal] || []).push(l));
  return Object.keys(grup).sort().reverse().map(tgl => {
    const t = rwTanggal(tgl);
    return `
      <div class="rw-day">${t.hari}, ${t.tgl} ${t.bulan}</div>
      ${grup[tgl].map(l => {
        const [label, ikon, warna] = RW_AKSI[l.aksi] || [rwHumanize(l.aksi), 'fa-circle-dot', '#6b7280'];
        const detail = rwEsc(l.detail).replace(/ \| /g, ' · ');
        return `
        <div class="rw-log">
          <div class="rw-log-ico" style="background:${warna}1a;color:${warna}"><i class="fas ${ikon}"></i></div>
          <div class="rw-log-txt">
            <div class="rw-log-aksi">${label}</div>
            ${detail ? `<div class="rw-log-detail">${detail}</div>` : ''}
          </div>
          <div class="rw-log-jam">${l.jam || ''}</div>
        </div>`;
      }).join('')}`;
  }).join('');
}

function togglePassField(inputId, iconId) {
  const inp = document.getElementById(inputId);
  const ico = document.getElementById(iconId);
  if (!inp) return;
  if (inp.type === 'password') { inp.type = 'text'; if(ico) ico.className = 'fas fa-eye-slash'; }
  else { inp.type = 'password'; if(ico) ico.className = 'fas fa-eye'; }
}

async function simpanProfil() {
  const nama  = document.getElementById('pr-nama').value.trim();
  const nip   = document.getElementById('pr-nip').value.trim();
  const mapel = document.getElementById('pr-mapel').value.trim();
  if (!nama) { toast('Nama tidak boleh kosong!', 'warn'); return; }
  const res = await callGAS('updateProfile', { nama, nip, mapel, passwordLama: '', passwordBaru: '', passwordKonfirm: '' });
  toast(res.message, res.success ? 'success' : 'error');
  if (res.success && res.user) {
    currentUser = { ...currentUser, nama: res.user.nama, nip: res.user.nip, mapel: res.user.mapel };
    try { saveUser(currentUser); } catch(e) {}
  }
}

async function simpanPassword() {
  const pwLama    = document.getElementById('pr-pw-lama').value;
  const pwBaru    = document.getElementById('pr-pw-baru').value;
  const pwKonfirm = document.getElementById('pr-pw-konfirm').value;
  if (!pwLama || !pwBaru || !pwKonfirm) { toast('Isi semua field password!', 'warn'); return; }
  if (pwBaru !== pwKonfirm) { toast('Konfirmasi password tidak cocok!', 'warn'); return; }
  if (pwBaru.length < 6) { toast('Password baru minimal 6 karakter!', 'warn'); return; }
  const res = await callGAS('updateProfile', {
    nama: currentUser.nama, nip: currentUser.nip, mapel: currentUser.mapel,
    passwordLama: pwLama, passwordBaru: pwBaru, passwordKonfirm: pwKonfirm
  });
  toast(res.message, res.success ? 'success' : 'error');
  if (res.success) {
    document.getElementById('pr-pw-lama').value = '';
    document.getElementById('pr-pw-baru').value = '';
    document.getElementById('pr-pw-konfirm').value = '';
  }
}

</script>
