function saveToken(token) {
  sessionToken = token;
  try {
    localStorage.setItem('sihadir_token', token);
    localStorage.setItem('sihadir_token_saved', Date.now());
  } catch(e) {}
}
function loadToken() {
  try {
    const token = localStorage.getItem('sihadir_token');
    const saved = parseInt(localStorage.getItem('sihadir_token_saved') || '0');
    const usia  = Date.now() - saved;
    const MAX   = 30 * 24 * 60 * 60 * 1000;
    if (!token || usia > MAX) { clearToken(); return null; }
    return token;
  } catch(e) { return null; }
}
function clearToken() {
  sessionToken = null;
  try {
    localStorage.removeItem('sihadir_token');
    localStorage.removeItem('sihadir_token_saved');
    localStorage.removeItem('sihadir_user');
  } catch(e) {}
}
function saveUser(user) {
  try { localStorage.setItem('sihadir_user', JSON.stringify(user)); } catch(e) {}
}
function loadUser() {
  try {
    const u = localStorage.getItem('sihadir_user');
    return u ? JSON.parse(u) : null;
  } catch(e) { return null; }
}

function callGAS(fn, ...args) {
  // Timeout mutlak 20 detik: kalau server tidak merespons (atau google.script.run
  // tidak pernah memanggil handler karena fungsi .gs belum di-deploy), promise
  // TETAP resolve dengan error — spinner tidak boleh muter selamanya.
  return new Promise((res) => {
    let selesai = false;
    const done = (v) => { if (!selesai) { selesai = true; res(v); } };
    setTimeout(() => done({ success: false, message: 'Server tidak merespons (>20 detik). Periksa deploy & koneksi, lalu coba lagi.' }), 20000);
    const TOKEN_REQUIRED = ['absenMasuk','absenPulang','cekStatusAbsenHariIni','getDataUser',
      'submitLaporanMengajar','submitIzin','submitKegiatan',
      'getDashboardData','getAllAbsensi','getAllIzinKegiatan','prosesIzin','prosesKegiatan',
      'getSettingsAll','updateSettings','getAllUsers','addUser','updateUser','deleteUser',
      'getRekapBulanan','getRekapJamMengajar','logout','updateProfile',
      'getRekapKehadiran','exportRekapToSheet','exportRekapJamMengajarToSheet','getRiwayatUser',
      'getOpsiLaporan','getOpsiKegiatan','getStatusLaporanHariIni','getStatusKunciHarian','getRingkasanHariIni','getRingkasanBulananUser','getMasterData','tambahMaster','ubahMaster','hapusMaster','resetDatabase'];
    const finalArgs = TOKEN_REQUIRED.includes(fn) ? [sessionToken, ...args] : args;

    if (typeof google !== 'undefined' && google.script) {
      try {
        google.script.run
          .withSuccessHandler(done)
          .withFailureHandler(err => done({ success: false, message: 'Error: ' + ((err && err.message) || err) }))
          [fn](...finalArgs);
      } catch (e) {
        done({ success: false, message: 'Gagal memanggil server: ' + e.message });
      }
    } else {
      setTimeout(() => {
        try { done(mockGAS(fn, ...finalArgs)); }
        catch (e) { done({ success: false, message: 'Mock error: ' + e.message }); }
      }, 300);
    }
  });
}

function toast(msg, type = 'info', dur = 3500) {
  const icons = { success: 'fa-check-circle', error: 'fa-times-circle', info: 'fa-info-circle', warn: 'fa-exclamation-triangle' };
  const el = document.createElement('div');
  el.className = `toast ${type}`;
  el.innerHTML = `<i class="fas ${icons[type]||icons.info}"></i><span>${msg.replace(/\n/g,'<br>')}</span>`;
  document.getElementById('toast-container').appendChild(el);
  setTimeout(() => el.style.opacity = '0', dur);
  setTimeout(() => el.remove(), dur + 400);
}

function escapeHtml(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]));
}

function showModal(html, customClass = '') {
  const modalEl = document.getElementById('modal-content');
  modalEl.className = 'modal' + (customClass ? ' ' + customClass : '');
  modalEl.innerHTML = html;
  document.getElementById('modal-overlay').classList.remove('hidden');
}
function closeModal(e) {
  if (!e || e.target === document.getElementById('modal-overlay')) {
    document.getElementById('modal-overlay').classList.add('hidden');
    const modalEl = document.getElementById('modal-content');
    if (modalEl) modalEl.className = 'modal';
  }
}

function fmt(date, f = 'DD/MM/YYYY') {
  if (!date) return '—';
  const d = new Date(date);
  if (isNaN(d)) return '—';
  const pad = n => String(n).padStart(2, '0');
  if (f === 'DD/MM/YYYY') return `${pad(d.getDate())}/${pad(d.getMonth()+1)}/${d.getFullYear()}`;
  if (f === 'HH:mm') return `${pad(d.getHours())}:${pad(d.getMinutes())}`;
  if (f === 'DD/MM HH:mm') return `${pad(d.getDate())}/${pad(d.getMonth()+1)} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
  return d.toLocaleString('id-ID');
}

function statusBadge(s) {
  s = (s || '').toUpperCase();
  if (['DISETUJUI','TEPAT WAKTU','NORMAL'].includes(s)) return `<span class="badge badge-success">${s}</span>`;
  if (['DITOLAK','TERLAMBAT','PULANG AWAL'].includes(s)) return `<span class="badge badge-danger">${s}</span>`;
  if (['MENUNGGU','TOLERANSI'].includes(s)) return `<span class="badge badge-warning">${s}</span>`;
  return `<span class="badge badge-gray">${s||'—'}</span>`;
}

  const icon = document.getElementById('pass-eye-icon');
  if (inp.type === 'password') {

    icon.className = 'fas fa-eye-slash';

function loadLogoConfig() {
  try {
    const logoUrl   = localStorage.getItem('sihadir_logo_url') || '';
    const appTitle  = localStorage.getItem('sihadir_app_title') || 'SIHADIR';
    const appSub    = localStorage.getItem('sihadir_app_subtitle') || 'Sistem Absensi Geofencing Sekolah';
    document.getElementById('app-title').textContent = appTitle;
    document.getElementById('app-subtitle').textContent = appSub;
    if (logoUrl) {
      const img = document.getElementById('logo-img');
      img.src = logoUrl;
      img.style.display = 'block';
      document.getElementById('logo-icon-fallback').style.display = 'none';
    }
    const sbTitle = document.getElementById('sidebar-app-title');
    if (sbTitle) sbTitle.textContent = appTitle;
  } catch(e) {}
}

window.__sihadir_booted = false;
function __sihadir_boot() {
  if (window.__sihadir_booted) return;
  window.__sihadir_booted = true;
  setInterval(() => {
    const now = new Date();
    const el = document.getElementById('live-clock');
    if (el) el.textContent =
      now.toLocaleDateString('id-ID',{weekday:'long',year:'numeric',month:'long',day:'numeric'}) + '  ' +
      now.toLocaleTimeString('id-ID');
  }, 1000);
  loadLogoConfig();

  const savedToken = loadToken();
  const savedUser  = loadUser();

  if (savedToken && savedUser) {
    sessionToken = savedToken;
    currentUser  = savedUser;
    setTimeout(() => {
      document.getElementById('loading-screen').style.opacity = '0';
      setTimeout(() => {
        document.getElementById('loading-screen').style.display = 'none';
        setupApp();
      }, 500);
    }, 1500);

    callGAS('cekStatusAbsenHariIni').then(res => {
      if (res && res.error && res.error.includes('Sesi tidak valid')) {
        toast('Sesi habis, silakan login kembali', 'warn');
        doLogout();
      }
    }).catch(() => {});

  } else {
    setTimeout(() => {
      document.getElementById('loading-screen').style.opacity = '0';
      setTimeout(() => {
        document.getElementById('loading-screen').style.display = 'none';
        document.getElementById('login-page').classList.remove('hidden');
      }, 500);
    }, 2200);
  }
}

// Jalankan boot lewat SEMUA jalur yang tersedia + pengaman timeout mutlak:
// - window.onload bisa tidak pernah menyala kalau ada resource (font/CDN) yang gagal/gantung,
//   padahal semua file lokal sintaksnya valid — itu yang bikin "berhenti di halaman loading".
// - Pengaman 6 detik: apa pun yang terjadi, loading wajib hilang (muncul login / sesi tersimpan).
window.addEventListener('load', __sihadir_boot);
document.addEventListener('DOMContentLoaded', __sihadir_boot);
setTimeout(__sihadir_boot, 6000);

function toggleSidebar() {
  document.getElementById('sidebar').classList.toggle('open');
}

// AUTH
async function doLogin() {
  const email = document.getElementById('login-email').value.trim();
  const pass = document.getElementById('login-pass').value;
  if (!email || !pass) { toast('Isi email dan password!', 'warn'); return; }
  const btn = document.getElementById('btn-login');
  btn.disabled = true; btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Memverifikasi...';
  try {
    const res = await callGAS('login', email, pass);
    if (res.success) {
      currentUser = res.user;
      saveToken(res.token);
      saveUser(res.user);
      setupApp();
    } else {
      toast(res.message, 'error');
    }
  } catch(e) { toast('Koneksi gagal: ' + e, 'error'); }
  finally { btn.disabled = false; btn.innerHTML = '<i class="fas fa-sign-in-alt"></i> Masuk ke Sistem'; }
}

document.addEventListener('keydown', e => { if (e.key === 'Enter' && !document.getElementById('login-page').classList.contains('hidden')) doLogin(); });

function setupApp() {
  document.getElementById('login-page').classList.add('hidden');
  document.getElementById('app').style.display = 'block';
  document.getElementById('sb-user-name').textContent = currentUser.nama;
  const roleLabel = currentUser.role === 'admin' ? '🔑 Administrator' : currentUser.role === 'user_guru' ? '👨‍🏫 Guru Pengajar' : '👤 Tenaga Pendidik';
  document.getElementById('sb-user-role').textContent = roleLabel;
  document.getElementById('topbar-name').textContent = currentUser.nama;
  document.getElementById('topbar-role').textContent = currentUser.role === 'admin' ? 'Admin' : 'User';

  if (currentUser.role === 'admin') {
    document.body.classList.remove('user-mode');
    document.getElementById('nav-user').classList.add('hidden');
    document.getElementById('nav-admin').classList.remove('hidden');
    showPage('dashboard');
  } else {
    document.body.classList.add('user-mode');
    document.getElementById('nav-user').classList.remove('hidden');
    document.getElementById('nav-admin').classList.add('hidden');
    showUserHome();
  }
}

async function doLogout() {
  await callGAS('logout');
  clearToken();
  if (window._userClockInterval) {
    clearInterval(window._userClockInterval);
    window._userClockInterval = null;
  }
  currentUser = null; statusAbsen = { masuk: false, pulang: false };
  document.body.classList.remove('user-mode');
  document.getElementById('app').style.display = 'none';
  document.getElementById('login-page').classList.remove('hidden');
  document.getElementById('login-email').value = '';
  document.getElementById('login-pass').value = '';
  toast('Anda telah keluar dari sistem', 'info');
}

// USER GRID MENU
const USER_MENUS = [
  { id: 'absen',    label: 'Presensi',         icon: 'fas fa-fingerprint',      color: '#1565c0' },
  { id: 'laporan',  label: 'Lap. Mengajar',    icon: 'fas fa-chalkboard-teacher',color: '#00897b' },
  { id: 'izin',     label: 'Izin',             icon: 'fas fa-file-alt',         color: '#f57f17' },
  { id: 'kegiatan', label: 'Kegiatan',         icon: 'fas fa-calendar-check',   color: '#6a1b9a' },
  { id: 'log',      label: 'Riwayat',    icon: 'fas fa-history',          color: '#00838f' },
  { id: 'profil',   label: 'Profil',           icon: 'fas fa-user-cog',         color: '#c62828' },
];

async function showUserHome() {
  const initials = (currentUser.nama || 'U')
    .split(' ').slice(0, 2).map(w => w[0]).join('').toUpperCase();

  // Header + grid menu tampil SEKETIKA (tidak menunggu data), supaya navigasi tetap terasa instan.
  // Grid "Ringkasan Bulanan" di bawahnya tampil belakangan begitu datanya selesai dimuat.
  document.getElementById('page-body').innerHTML = `
    <div class="user-header">
      <button class="user-header-logout" onclick="doLogout()">
        <i class="fas fa-sign-out-alt"></i> Keluar
      </button>

      <div class="user-header-clock" id="user-clock">
        <i class="fas fa-clock"></i>
        <span id="user-clock-text">00:00:00</span>
      </div>

      <div class="user-avatar">${initials}</div>
      <div class="user-header-name">${currentUser.nama}</div>
      <div class="user-header-jabatan">${currentUser.mapel || 'User'} &nbsp;|&nbsp; NIP: ${currentUser.nip || '—'}</div>
      <div class="user-header-wave"></div>
    </div>

    <div class="user-menu-grid">
      ${USER_MENUS.map(m => `
        <div class="user-menu-item" onclick="showUserPage('${m.id}')">
          <div class="user-menu-icon">
            <i class="${m.icon}" style="font-size:2.2rem;color:${m.color}"></i>
          </div>
          <div class="user-menu-label">${m.label}</div>
        </div>
      `).join('')}
    </div>
    <div id="home-ringkasan" style="padding:0 16px 24px;max-width:480px;margin:0 auto;">
      <div class="card" style="text-align:center;padding:20px;color:var(--c-text-muted);"><i class="fas fa-spinner fa-spin"></i></div>
    </div>`;

  if (window._userClockInterval) {
    clearInterval(window._userClockInterval);
  }
  const pad = n => String(n).padStart(2, '0');
  window._userClockInterval = setInterval(() => {
    const el = document.getElementById('user-clock-text');
    if (!el) {
      clearInterval(window._userClockInterval);
      window._userClockInterval = null;
      return;
    }
    const now = new Date();
    el.textContent = `${pad(now.getHours())}:${pad(now.getMinutes())}:${pad(now.getSeconds())}`;
  }, 1000);

  const rb = await callGAS('getRingkasanBulananUser');
  const wrap = document.getElementById('home-ringkasan');
  if (!wrap) return; // user sudah pindah halaman sebelum data ini selesai dimuat
  wrap.innerHTML = (rb && rb.success) ? renderRingkasanBulanan(rb) : '';
}

// Grid ringkas statistik bulan berjalan milik user — minimalis + bisa di-toggle (hide/show).
// Kartu "Total Mengajar (JP)" sudah dihapus sesuai permintaan.
function renderRingkasanBulanan(r) {
  const hadir = Number(r.hadir || 0);
  const telat = Number(r.telat || 0);
  const izin  = Number(r.izin || 0);
  const alpha = Number(r.alpha || 0);
  const periode = (r.namaBulan ? r.namaBulan + ' ' : '') + (r.tahun || '');
  let terbuka = true;
  try { terbuka = localStorage.getItem('sihadir_ringkas_open') !== '0'; } catch(e) {}
  const item = (ikon, warnaBg, warnaIkon, nilai, label) => `
    <div style="display:flex;align-items:center;gap:10px;padding:9px 10px;background:var(--c-surface2);border:1px solid var(--c-border);border-radius:12px;">
      <div style="width:34px;height:34px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:.95rem;flex:0 0 34px;background:${warnaBg};color:${warnaIkon};">
        <i class="fas ${ikon}"></i>
      </div>
      <div style="line-height:1.2;">
        <div style="font-size:1.05rem;font-weight:800;color:var(--c-text);">${nilai}</div>
        <div style="font-size:.68rem;color:var(--c-text-muted);font-weight:600;">${label}</div>
      </div>
    </div>`;
  return `
    <div class="card" style="padding:14px 16px;">
      <div onclick="toggleRingkasanBulanan()" style="display:flex;align-items:center;justify-content:space-between;gap:10px;cursor:pointer;user-select:none;">
        <div style="display:flex;align-items:center;gap:8px;min-width:0;">
          <i class="fas fa-chart-pie" style="color:var(--c-text-muted);font-size:.8rem;"></i>
          <span style="font-size:.82rem;font-weight:700;color:var(--c-text);white-space:nowrap;">Ringkasan Bulanan</span>
          ${periode ? `<span style="font-size:.68rem;font-weight:600;color:var(--c-text-muted);background:var(--c-surface2);border:1px solid var(--c-border);border-radius:20px;padding:2px 9px;white-space:nowrap;">${periode}</span>` : ''}
        </div>
        <i id="ringkas-chevron" class="fas fa-chevron-${terbuka ? 'up' : 'down'}" style="color:var(--c-text-muted);font-size:.75rem;flex:0 0 auto;"></i>
      </div>
      <div id="ringkas-body" style="display:${terbuka ? 'grid' : 'none'};grid-template-columns:1fr 1fr;gap:10px;margin-top:12px;">
        ${item('fa-check-double', 'rgba(0,137,123,.12)', 'var(--c-success)', hadir, 'Hadir')}
        ${item('fa-clock', 'rgba(245,127,23,.14)', 'var(--c-warning)', telat, 'Terlambat')}
        ${item('fa-file-medical', 'rgba(26,35,126,.10)', 'var(--c-primary)', izin, 'Izin / Sakit')}
        ${item('fa-times-circle', 'rgba(198,40,40,.10)', 'var(--c-danger)', alpha, 'Tanpa Ket.')}
      </div>
    </div>`;
}

// Toggle tampil/sembunyi isi Ringkasan Bulanan (preferensi disimpan di localStorage).
function toggleRingkasanBulanan() {
  const body = document.getElementById('ringkas-body');
  const chev = document.getElementById('ringkas-chevron');
  if (!body) return;
  const buka = body.style.display === 'none';
  body.style.display = buka ? 'grid' : 'none';
  if (chev) chev.className = 'fas fa-chevron-' + (buka ? 'up' : 'down');
  try { localStorage.setItem('sihadir_ringkas_open', buka ? '1' : '0'); } catch(e) {}
}

// [DIAGNOSIS] Tangkap error JS MILIK APLIKASI saja (script google internal seperti
// userCodeAppPanel diabaikan — itu iframe otorisasi Google, bukan bug kode kita).
// Tanpa filter ini, toast merah menuduh error yang salah (persis seperti di screenshot).
window.addEventListener('error', (ev) => {
  try {
    const file = String((ev && ev.filename) || '');
    if (/userCodeAppPanel|createOAuthDialog|oauth|accounts\.google|apis\.google|gstatic/i.test(file)) return;
    const msg = (ev && ev.message) || 'Unknown error';
    if (/userCodeAppPanel|createOAuthDialog/i.test(msg)) return;
    const src = (file ? file.split('/').pop() : '') + (ev && ev.lineno ? ':' + ev.lineno : '');
    toast('JS Error: ' + msg + (src ? ' (' + src + ')' : ''), 'error', 8000);
  } catch (e) {}
});
window.addEventListener('unhandledrejection', (ev) => {
  try {
    const r = ev && ev.reason;
    toast('Promise gagal: ' + String((r && (r.message || r)) || r).slice(0, 200), 'error', 8000);
  } catch (e) {}
});

function showUserPage(name) {
  if (window._userClockInterval) {
    clearInterval(window._userClockInterval);
    window._userClockInterval = null;
  }
  // [REWRITE] Mekanisme bajak-document dihapus total — itu biang semua-menu-muter:
  // fakeEl + getElementById palsu bikin tulisan halaman nyasar/hilang saat klik cepat
  // atau saat error terjadi sebelum finally. Sekarang halaman render LANGSUNG ke
  // #user-inner-body tanpa perantara apa pun.
  const titles = {
    absen: 'Presensi', laporan: 'Laporan Mengajar',
    izin: 'Pengajuan Izin', kegiatan: 'Kegiatan Lainnya',
    log: 'Riwayat', profil: 'Profil & Keamanan'
  };
  const errHTML = (pesan) => `
      <div class="card" style="text-align:center;padding:40px 24px;">
        <i class="fas fa-wifi fa-2x" style="color:var(--c-text-muted);margin-bottom:12px;"></i>
        <div style="font-weight:800;margin-bottom:6px;">Gagal memuat halaman</div>
        <div style="font-size:.82rem;color:var(--c-text-muted);margin-bottom:16px;">${pesan}</div>
        <button class="btn btn-primary" onclick="showUserPage('${name}')"><i class="fas fa-rotate-right"></i> Coba Lagi</button>
      </div>`;
  const tulis = (html) => {
    const t = document.getElementById('user-inner-body');
    if (t) t.innerHTML = html;
  };
  try {
    document.getElementById('page-body').innerHTML = `
    <div class="user-inner-page">
      <div class="user-inner-topbar">
        <button class="user-inner-back" onclick="showUserHome()">
          <i class="fas fa-arrow-left"></i> Kembali
        </button>
        <div class="user-inner-title">${titles[name] || name}</div>
      </div>
      <div class="user-inner-body" id="user-inner-body">
        <div style="text-align:center;padding:40px;color:var(--c-text-muted);">
          <i class="fas fa-spinner fa-spin fa-2x"></i>
        </div>
      </div>
    </div>`;
  } catch (e) {
    try { toast('Gagal membuka halaman: ' + e.message, 'error'); } catch(_e) {}
    return;
  }

  // Bungkus SEMUA fungsi page: jadikan #user-inner-body sebagai "page-body sementara"
  // dengan node ASLI (bukan fake object), supaya .innerHTML/.querySelector/.value
  // semua bekerja normal. Tanpa menyentuh document.getElementById global sama sekali.
  const targetAsli = document.getElementById('user-inner-body');
  if (targetAsli) targetAsli.id = 'user-inner-body-asli';
  const kerangka = document.getElementById('page-body');
  if (kerangka) kerangka.id = 'page-body-asli';
  if (targetAsli) targetAsli.id = 'page-body';
  const pulihkanDOM = () => {
    try {
      const p = document.getElementById('page-body');
      const k = document.getElementById('page-body-asli');
      if (p && p.id === 'page-body' && k) { p.id = 'user-inner-body'; }
      if (k) k.id = 'page-body';
      const sisa = document.getElementById('user-inner-body-asli');
      if (sisa) sisa.id = 'user-inner-body';
    } catch(e) {}
    window._sihadir_bajak = false; window._sihadir_origGetEl = null;
  };

  let pages;
  try {
    pages = { absen: pageAbsen, laporan: pageLaporan, izin: pageIzin, kegiatan: pageKegiatan, log: pageRiwayat, profil: pageProfil };
  } catch (e) {
    pulihkanDOM();
    tulis(errHTML('File script halaman belum lengkap di server.<br><span style="font-size:.72rem;">Detail: ' + escapeHtml(String((e && e.message) || e)).slice(0,200) + '</span><br><span style="font-size:.72rem;">Pastikan js-user.html & js-admin.html sudah ter-paste + deploy New version.</span>'));
    return;
  }
  if (!pages[name]) {
    pulihkanDOM();
    tulis(errHTML('Halaman tidak ditemukan: ' + escapeHtml(name)));
    return;
  }

  {
    // Pengaman: kalau server >25 detik tidak merespons (atau promise ditolak),
    // spinner jangan muter selamanya — tampilkan tombol "Coba Lagi".
    const timer = setTimeout(() => {
      pulihkanDOM();
      const t = document.getElementById('user-inner-body');
      if (t && t.querySelector('.fa-spinner')) {
        t.innerHTML = errHTML('Server tidak merespons. Periksa koneksi internet Anda lalu coba lagi.');
      }
    }, 25000);
    let hasil;
    try {
      hasil = pages[name]();
    } catch (err) {
      // Error sinkron (mis. fungsi halaman crash sebelum sempat render) — jangan biarkan spinner & jangan biarkan DOM terbajak.
      clearTimeout(timer);
      pulihkanDOM();
      tulis(errHTML('Terjadi kesalahan saat membuka halaman.' + (err && (err.message || err) ? '<br><span style="font-size:.72rem;">Detail: ' + escapeHtml(String((err && err.message) || err)).slice(0, 200) + '</span>' : '')));
      return;
    }
    Promise.resolve(hasil).catch((err) => {
      // [FIX] Tampilkan pesan error ASLI (bukan generik) supaya ketahuan fungsi mana yang gagal.
      const msg = 'Terjadi kesalahan saat memuat data.' + (err && (err.message || err) ? '<br><span style="font-size:.72rem;">Detail: ' + escapeHtml(String((err && err.message) || err)).slice(0, 200) + '</span>' : '');
      const t = document.getElementById('user-inner-body');
      if (t && t.querySelector('.fa-spinner')) {
        t.innerHTML = errHTML(msg);
      }
    }).finally(() => {
      clearTimeout(timer);
      pulihkanDOM();
    });
  }
}

const PAGE_TITLES = { absen:'Absensi', laporan:'Laporan Mengajar', izin:'Pengajuan Izin', kegiatan:'Kegiatan Lainnya', log:'Riwayat', profil:'Profil & Keamanan', dashboard:'Dashboard Admin', approval:'Persetujuan', rekap:'Rekap Bulanan', 'rekap-jam':'Rekap Jam Mengajar', 'admin-absensi':'Data Absensi', 'crud-user':'Manajemen User', master:'Master Data', settings:'Setting Geofencing' };

function showPage(name) {
  document.getElementById('page-title').textContent = PAGE_TITLES[name] || name;
  document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
  document.querySelectorAll('.nav-item').forEach(n => { if (n.getAttribute('onclick') && n.getAttribute('onclick').includes(`'${name}'`)) n.classList.add('active'); });
  if (window.innerWidth < 900) document.getElementById('sidebar').classList.remove('open');
  const body = document.getElementById('page-body');
  body.innerHTML = '<div style="padding:40px;text-align:center;color:var(--c-text-muted);"><i class="fas fa-spinner fa-spin fa-2x"></i></div>';
  const pages = { absen: pageAbsen, laporan: pageLaporan, izin: pageIzin, kegiatan: pageKegiatan, log: pageRiwayat, profil: pageProfil, dashboard: pageDashboard, approval: pageApproval, rekap: pageRekap, 'rekap-jam': pageRekapJam, 'admin-absensi': pageAdminAbsensi, 'crud-user': pageCrudUser, master: pageMaster, settings: pageSettings };
  if (pages[name]) pages[name]();
  else body.innerHTML = '<div style="padding:40px;text-align:center;color:var(--c-text-muted);">Halaman tidak ditemukan</div>';
}
