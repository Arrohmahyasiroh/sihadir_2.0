<style>
/* ─── RESET & VARIABLES ─────────────────────────────── */
*{margin:0;padding:0;box-sizing:border-box;}
:root{
  --c-primary:#1a237e;
  --c-primary-light:#3949ab;
  --c-accent:#00bcd4;
  --c-accent2:#ff6f00;
  --c-success:#00897b;
  --c-danger:#c62828;
  --c-warning:#f57f17;
  --c-bg:#f0f4ff;
  --c-surface:#ffffff;
  --c-surface2:#f5f7ff;
  --c-text:#1a1a2e;
  --c-text-muted:#6b7280;
  --c-border:#e2e8f0;
  --radius:14px;
  --radius-sm:8px;
  --shadow:0 4px 24px rgba(26,35,126,0.10);
  --shadow-lg:0 8px 40px rgba(26,35,126,0.16);
  --trans:.22s cubic-bezier(.4,0,.2,1);
}
body{font-family:'Plus Jakarta Sans',sans-serif;background:var(--c-bg);color:var(--c-text);min-height:100vh;overflow-x:hidden;}

/* ─── SCROLLBAR ──────────────────────────────────────── */
::-webkit-scrollbar{width:5px;height:5px;}
::-webkit-scrollbar-track{background:var(--c-bg);}
::-webkit-scrollbar-thumb{background:var(--c-primary-light);border-radius:10px;}

/* ─── UTILITY ────────────────────────────────────────── */
.hidden{display:none!important;}
.flex{display:flex;}
.flex-col{flex-direction:column;}
.items-center{align-items:center;}
.justify-between{justify-content:space-between;}
.gap-2{gap:8px;}
.gap-3{gap:12px;}
.gap-4{gap:16px;}
.w-full{width:100%;}
.text-sm{font-size:.82rem;}
.text-xs{font-size:.72rem;}
.font-bold{font-weight:700;}
.font-semibold{font-weight:600;}
.rounded{border-radius:var(--radius-sm);}
.mt-2{margin-top:8px;}
.mt-3{margin-top:12px;}
.mb-3{margin-bottom:12px;}

/* ─── TOAST ──────────────────────────────────────────── */
#toast-container{position:fixed;top:20px;right:20px;z-index:9999;display:flex;flex-direction:column;gap:10px;}
.toast{display:flex;align-items:center;gap:10px;padding:14px 18px;border-radius:12px;font-size:.88rem;font-weight:600;max-width:340px;box-shadow:0 8px 32px rgba(0,0,0,.18);animation:slideIn .3s ease;backdrop-filter:blur(12px);}
.toast.success{background:rgba(0,137,123,.95);color:#fff;}
.toast.error{background:rgba(198,40,40,.95);color:#fff;}
.toast.info{background:rgba(26,35,126,.95);color:#fff;}
.toast.warn{background:rgba(245,127,23,.95);color:#fff;}
@keyframes slideIn{from{transform:translateX(120%);opacity:0;}to{transform:translateX(0);opacity:1;}}

/* ─── MODAL ──────────────────────────────────────────── */
.modal-overlay{position:fixed;inset:0;background:rgba(10,10,30,.6);backdrop-filter:blur(4px);z-index:1000;display:flex;align-items:center;justify-content:center;padding:16px;animation:fadeIn .2s ease;}
.modal{background:var(--c-surface);border-radius:18px;padding:28px;width:100%;max-width:480px;box-shadow:var(--shadow-lg);animation:scaleIn .3s ease;max-height:90vh;overflow-y:auto;}
.modal.modal-lg{max-width:780px;width:95%;}
.modal h3{font-size:1.1rem;font-weight:700;margin-bottom:16px;color:var(--c-primary);}
.btn-detail-mengajar{background:linear-gradient(135deg,var(--c-primary),var(--c-primary-light));color:#fff;border-radius:8px;padding:6px 12px;font-size:.78rem;font-weight:600;display:inline-flex;align-items:center;gap:6px;box-shadow:0 2px 8px rgba(26,35,126,.18);transition:var(--trans);white-space:nowrap;}
.btn-detail-mengajar:hover{transform:translateY(-1px);box-shadow:0 4px 14px rgba(26,35,126,.3);color:#fff;}
@keyframes fadeIn{from{opacity:0;}to{opacity:1;}}
@keyframes scaleIn{from{transform:scale(.93);opacity:0;}to{transform:scale(1);opacity:1;}}

/* ─── LOADING ────────────────────────────────────────── */
#loading-screen{position:fixed;inset:0;background:var(--c-primary);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:9999;transition:opacity .5s;}
.loader-logo{font-size:2.8rem;font-weight:800;color:#fff;letter-spacing:-1px;margin-bottom:8px;}
.loader-logo span{color:var(--c-accent);}
.loader-sub{color:rgba(255,255,255,.7);font-size:.9rem;margin-bottom:32px;}
.loader-bar{width:200px;height:4px;background:rgba(255,255,255,.2);border-radius:10px;overflow:hidden;}
.loader-fill{height:100%;background:var(--c-accent);border-radius:10px;animation:load 2s ease forwards;}
@keyframes load{from{width:0}to{width:100%}}

/* ─── LOGIN PAGE ─────────────────────────────────────── */
#login-page{min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#1a237e 0%,#283593 50%,#1565c0 100%);padding:20px;}
.login-card{background:#fff;border-radius:24px;padding:40px 36px;width:100%;max-width:420px;box-shadow:0 24px 64px rgba(0,0,0,.25);}
.login-logo{text-align:center;margin-bottom:28px;}
.login-logo-icon{width:64px;height:64px;background:linear-gradient(135deg,var(--c-primary),var(--c-accent));border-radius:18px;display:flex;align-items:center;justify-content:center;margin:0 auto 12px;font-size:1.8rem;color:#fff;}
.login-title{font-size:1.6rem;font-weight:800;color:var(--c-primary);letter-spacing:-0.5px;}
.login-sub{font-size:.82rem;color:var(--c-text-muted);margin-top:4px;}
.form-group{margin-bottom:16px;}
.form-label{display:block;font-size:.8rem;font-weight:600;color:var(--c-text-muted);margin-bottom:6px;text-transform:uppercase;letter-spacing:.5px;}
.form-input{width:100%;padding:12px 14px;border:2px solid var(--c-border);border-radius:10px;font-size:.92rem;font-family:inherit;transition:var(--trans);outline:none;background:var(--c-surface2);}
.form-input:focus{border-color:var(--c-primary);background:#fff;box-shadow:0 0 0 4px rgba(26,35,126,.08);}
.input-icon-wrap{position:relative;}
.input-icon-wrap .form-input{padding-left:42px;}
.input-icon{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--c-text-muted);font-size:.9rem;}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 20px;border-radius:10px;font-size:.88rem;font-weight:700;font-family:inherit;border:none;cursor:pointer;transition:var(--trans);}
.btn-primary{background:linear-gradient(135deg,var(--c-primary),var(--c-primary-light));color:#fff;box-shadow:0 4px 16px rgba(26,35,126,.3);}
.btn-primary:hover{transform:translateY(-1px);box-shadow:0 8px 24px rgba(26,35,126,.4);}
.btn-sm{padding:8px 14px;font-size:.78rem;border-radius:8px;}
.btn-success{background:linear-gradient(135deg,#00897b,#00acc1);color:#fff;}
.btn-danger{background:linear-gradient(135deg,#c62828,#e53935);color:#fff;}
.btn-warning{background:linear-gradient(135deg,#f57f17,#ff8f00);color:#fff;}
.btn-accent{background:linear-gradient(135deg,var(--c-accent),#0097a7);color:#fff;}
.btn-ghost{background:var(--c-surface2);color:var(--c-text);border:1.5px solid var(--c-border);}
.btn-ghost:hover{background:var(--c-border);}
.btn-full{width:100%;}

/* ─── APP SHELL ──────────────────────────────────────── */
#app{display:none;}
.sidebar{position:fixed;left:0;top:0;bottom:0;width:260px;background:var(--c-primary);display:flex;flex-direction:column;z-index:100;transition:transform var(--trans);}
.sidebar-logo{padding:24px 20px 16px;border-bottom:1px solid rgba(255,255,255,.1);}
.sidebar-logo-title{font-size:1.3rem;font-weight:800;color:#fff;letter-spacing:-0.5px;}
.sidebar-logo-title span{color:var(--c-accent);}
.sidebar-logo-sub{font-size:.72rem;color:rgba(255,255,255,.5);margin-top:2px;}
.sidebar-user{padding:14px 20px;background:rgba(0,0,0,.15);border-bottom:1px solid rgba(255,255,255,.08);}
.sidebar-user-name{font-size:.88rem;font-weight:700;color:#fff;}
.sidebar-user-role{font-size:.72rem;color:rgba(255,255,255,.5);margin-top:2px;}
.sidebar-nav{flex:1;overflow-y:auto;padding:12px 0;}
.nav-section-title{font-size:.65rem;font-weight:700;color:rgba(255,255,255,.35);padding:14px 20px 6px;text-transform:uppercase;letter-spacing:1px;}
.nav-item{display:flex;align-items:center;gap:12px;padding:11px 20px;cursor:pointer;transition:var(--trans);color:rgba(255,255,255,.65);font-size:.87rem;font-weight:500;position:relative;}
.nav-item:hover,.nav-item.active{background:rgba(255,255,255,.12);color:#fff;}
.nav-item.active::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--c-accent);border-radius:0 4px 4px 0;}
.nav-item .nav-icon{width:20px;text-align:center;font-size:.95rem;}
.nav-badge{margin-left:auto;background:var(--c-accent2);color:#fff;font-size:.6rem;font-weight:700;padding:2px 6px;border-radius:10px;}
.sidebar-footer{padding:16px 20px;border-top:1px solid rgba(255,255,255,.1);}
.main-content{margin-left:260px;min-height:100vh;transition:margin var(--trans);}
.topbar{background:var(--c-surface);padding:16px 28px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--c-border);position:sticky;top:0;z-index:50;}
.topbar-title{font-size:1.1rem;font-weight:700;color:var(--c-text);}
.topbar-date{font-size:.78rem;color:var(--c-text-muted);}
.hamburger{display:none;background:none;border:none;cursor:pointer;color:var(--c-text);font-size:1.2rem;}
.page-body{padding:24px 28px;}

/* ─── CARDS ──────────────────────────────────────────── */
.card{background:var(--c-surface);border-radius:var(--radius);padding:20px;box-shadow:var(--shadow);}
.card-title{font-size:.88rem;font-weight:700;color:var(--c-text-muted);text-transform:uppercase;letter-spacing:.5px;margin-bottom:14px;}
.stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:16px;margin-bottom:24px;}
.stat-card{background:var(--c-surface);border-radius:var(--radius);padding:20px;box-shadow:var(--shadow);position:relative;overflow:hidden;}
.stat-card::before{content:'';position:absolute;top:-20px;right:-20px;width:80px;height:80px;border-radius:50%;opacity:.08;}
.stat-card.blue::before{background:var(--c-primary);}
.stat-card.teal::before{background:var(--c-success);}
.stat-card.orange::before{background:var(--c-accent2);}
.stat-card.red::before{background:var(--c-danger);}
.stat-card.yellow::before{background:var(--c-warning);}
.stat-icon{width:40px;height:40px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:1.1rem;margin-bottom:12px;}
.stat-icon.blue{background:rgba(26,35,126,.1);color:var(--c-primary);}
.stat-icon.teal{background:rgba(0,137,123,.1);color:var(--c-success);}
.stat-icon.orange{background:rgba(255,111,0,.1);color:var(--c-accent2);}
.stat-icon.red{background:rgba(198,40,40,.1);color:var(--c-danger);}
.stat-icon.yellow{background:rgba(245,127,23,.12);color:var(--c-warning);}
.stat-value{font-size:2rem;font-weight:800;line-height:1;color:var(--c-text);}
.stat-label{font-size:.75rem;color:var(--c-text-muted);margin-top:4px;font-weight:500;}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:20px;}
.grid-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:16px;}

/* ─── TABLE ──────────────────────────────────────────── */
.table-wrap{overflow-x:auto;border-radius:var(--radius-sm);}
table{width:100%;border-collapse:collapse;font-size:.82rem;}
th{background:var(--c-surface2);padding:10px 12px;text-align:left;font-weight:700;font-size:.72rem;text-transform:uppercase;letter-spacing:.5px;color:var(--c-text-muted);border-bottom:1px solid var(--c-border);}
td{padding:10px 12px;border-bottom:1px solid var(--c-border);color:var(--c-text);}
tr:hover td{background:var(--c-surface2);}
tr:last-child td{border-bottom:none;}

/* ─── BADGE ──────────────────────────────────────────── */
.badge{display:inline-flex;align-items:center;padding:3px 10px;border-radius:20px;font-size:.7rem;font-weight:700;}
.badge-success{background:rgba(0,137,123,.12);color:var(--c-success);}
.badge-danger{background:rgba(198,40,40,.12);color:var(--c-danger);}
.badge-warning{background:rgba(245,127,23,.12);color:var(--c-warning);}
.badge-info{background:rgba(26,35,126,.1);color:var(--c-primary);}
.badge-gray{background:var(--c-surface2);color:var(--c-text-muted);}

/* ─── ABSEN BUTTON ───────────────────────────────────── */
.absen-hero{background:linear-gradient(135deg,var(--c-primary) 0%,var(--c-primary-light) 60%,var(--c-accent) 100%);border-radius:20px;padding:28px;color:#fff;margin-bottom:24px;position:relative;overflow:hidden;}
.absen-hero::after{content:'';position:absolute;bottom:-30px;right:-30px;width:140px;height:140px;border-radius:50%;background:rgba(255,255,255,.06);}
.absen-hero h2{font-size:1.4rem;font-weight:800;margin-bottom:4px;}
.absen-hero p{font-size:.85rem;opacity:.75;margin-bottom:20px;}
.absen-btns{display:flex;gap:12px;flex-wrap:wrap;}
.btn-absen{padding:13px 24px;border-radius:12px;font-size:.9rem;font-weight:700;font-family:inherit;border:none;cursor:pointer;transition:var(--trans);display:flex;align-items:center;gap:8px;}
.btn-absen-masuk{background:#fff;color:var(--c-primary);}
.btn-absen-masuk:hover{background:rgba(255,255,255,.9);transform:translateY(-2px);}
.btn-absen-masuk:disabled{opacity:.5;cursor:not-allowed;transform:none;}
.btn-absen-pulang{background:rgba(255,255,255,.15);color:#fff;border:1.5px solid rgba(255,255,255,.4);}
.btn-absen-pulang:hover{background:rgba(255,255,255,.25);}
.btn-absen-pulang:disabled{opacity:.4;cursor:not-allowed;}
.absen-status-bar{display:flex;gap:12px;margin-top:14px;flex-wrap:wrap;}
.absen-chip{background:rgba(255,255,255,.15);padding:6px 14px;border-radius:20px;font-size:.78rem;display:flex;align-items:center;gap:6px;}
.absen-chip.ok{background:rgba(0,200,150,.25);}

/* ─── FORM ───────────────────────────────────────────── */
.form-row{display:grid;gap:14px;margin-bottom:14px;}
.form-row.cols-2{grid-template-columns:1fr 1fr;}
select.form-input{cursor:pointer;}
textarea.form-input{resize:vertical;min-height:80px;}
.form-section{background:var(--c-surface);border-radius:var(--radius);padding:22px;box-shadow:var(--shadow);}
.form-section-title{font-size:1rem;font-weight:700;color:var(--c-primary);margin-bottom:18px;padding-bottom:10px;border-bottom:2px solid var(--c-border);display:flex;align-items:center;gap:8px;}

/* ─── RESPONSIVE ─────────────────────────────────────── */
@media(max-width:900px){
  .sidebar{transform:translateX(-100%);}
  .sidebar.open{transform:translateX(0);}
  .main-content{margin-left:0;}
  .hamburger{display:block;}
  .grid-2,.grid-3{grid-template-columns:1fr;}
  .form-row.cols-2{grid-template-columns:1fr;}
}
@media(max-width:600px){
  .page-body{padding:16px;}
  .topbar{padding:12px 16px;}
  .stat-grid{grid-template-columns:1fr 1fr;}
}

/* ─── PASSWORD TOGGLE ────────────────────────────────── */
.input-icon-right{position:absolute;right:14px;top:50%;transform:translateY(-50%);color:var(--c-text-muted);font-size:.9rem;cursor:pointer;background:none;border:none;padding:0;transition:var(--trans);}
.input-icon-right:hover{color:var(--c-primary);}
.input-icon-wrap .form-input.has-right-icon{padding-right:42px;}

/* ─── USER MOBILE LAYOUT ────────────────────────────── */
body.user-mode .sidebar { display: none !important; }
body.user-mode .main-content { margin-left: 0 !important; }
body.user-mode .topbar { display: none !important; }
body.user-mode .page-body { padding: 0 !important; }

.user-header {
  background: linear-gradient(160deg, #1a237e 0%, #1565c0 60%, #00bcd4 100%);
  padding: 40px 20px 70px;
  text-align: center;
  position: relative;
}
.user-header-wave {
  position: absolute;
  bottom: -2px; left: 0; right: 0;
  height: 50px;
  background: var(--c-bg);
  clip-path: ellipse(55% 100% at 50% 100%);
}
.user-avatar {
  width: 80px; height: 80px;
  border-radius: 50%;
  background: rgba(255,255,255,.2);
  border: 3px solid rgba(255,255,255,.6);
  display: flex; align-items: center; justify-content: center;
  margin: 0 auto 14px;
  font-size: 2rem; font-weight: 800; color: #fff;
  letter-spacing: -1px;
}
.user-header-name {
  font-size: 1.1rem; font-weight: 800;
  color: #fff; letter-spacing: .5px;
  text-transform: uppercase;
  margin-bottom: 4px;
}
.user-header-jabatan {
  font-size: .78rem; color: rgba(255,255,255,.75);
}
.user-header-logout {
  position: absolute; top: 16px; left: 16px;
  background: rgba(255,255,255,.15); border: none;
  color: #fff; border-radius: 8px; padding: 8px 12px;
  cursor: pointer; font-size: .8rem; font-weight: 600;
  display: flex; align-items: center; gap: 6px;
  transition: var(--trans);
}
.user-header-logout:hover { background: rgba(255,255,255,.25); }

.user-header-clock {
  position: absolute;
  top: 16px;
  right: 16px;
  background: rgba(255,255,255,.15);
  border: 1.5px solid rgba(255,255,255,.3);
  border-radius: 10px;
  padding: 7px 13px;
  font-family: 'JetBrains Mono', monospace;
  font-size: 1rem;
  font-weight: 600;
  color: #fff;
  letter-spacing: 1px;
  display: flex;
  align-items: center;
  gap: 6px;
}
.user-header-clock i {
  font-size: .8rem;
  opacity: .8;
}

.user-menu-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 14px;
  padding: 10px 16px 30px;
  max-width: 480px;
  margin: 0 auto;
}
.user-menu-item {
  background: #fff;
  border-radius: 16px;
  padding: 20px 10px 14px;
  display: flex; flex-direction: column;
  align-items: center; gap: 10px;
  cursor: pointer;
  box-shadow: 0 2px 12px rgba(26,35,126,.09);
  transition: var(--trans);
  border: 1.5px solid var(--c-border);
}
.user-menu-item:hover, .user-menu-item:active {
  transform: translateY(-3px);
  box-shadow: 0 8px 24px rgba(26,35,126,.15);
  border-color: var(--c-primary-light);
}
.user-menu-icon {
  width: 54px; height: 54px;
  display: flex; align-items: center; justify-content: center;
}
.user-menu-icon img { width: 100%; height: 100%; object-fit: contain; }
.user-menu-icon i { font-size: 2rem; }
.user-menu-label {
  font-size: .72rem; font-weight: 700;
  color: #e65100;
  text-align: center; line-height: 1.3;
}

.user-inner-page { min-height: 100vh; background: var(--c-bg); }
.user-inner-topbar {
  background: linear-gradient(135deg, #1a237e, #1565c0);
  padding: 16px 16px 16px;
  display: flex; align-items: center; gap: 12px;
  position: sticky; top: 0; z-index: 50;
}
.user-inner-back {
  background: rgba(255,255,255,.15); border: none;
  color: #fff; border-radius: 8px; padding: 8px 12px;
  cursor: pointer; font-size: .85rem;
  display: flex; align-items: center; gap: 6px;
  font-family: inherit; font-weight: 600;
}
.user-inner-title {
  font-size: 1rem; font-weight: 700; color: #fff;
}
.user-inner-body { padding: 16px; }

/* ─── RIWAYAT (USER) ─────────────────────────────────── */
.rw-filter{display:flex;gap:8px;margin-bottom:12px;}
.rw-tabs{display:flex;gap:4px;padding:4px;background:var(--c-surface2);border:1.5px solid var(--c-border);border-radius:12px;margin-bottom:14px;}
.rw-tab{flex:1;padding:10px 8px;border:none;background:none;border-radius:9px;font:inherit;font-size:.85rem;font-weight:700;color:var(--c-text-muted);cursor:pointer;transition:var(--trans);}
.rw-tab.active{background:var(--c-surface);color:var(--c-primary);box-shadow:var(--shadow);}
.rw-tab:focus-visible{outline:2px solid var(--c-primary);outline-offset:2px;}
.rw-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px;}
.rw-stat{background:var(--c-surface);border-radius:var(--radius-sm);padding:10px 6px;text-align:center;box-shadow:var(--shadow);}
.rw-stat b{display:block;font-size:1.35rem;font-weight:800;line-height:1.2;}
.rw-stat span{font-size:.72rem;color:var(--c-text-muted);}
.rw-row{display:flex;align-items:center;gap:12px;background:var(--c-surface);border-radius:var(--radius-sm);padding:12px 14px;margin-bottom:8px;box-shadow:var(--shadow);}
.rw-date{min-width:44px;text-align:center;padding-right:12px;border-right:1.5px solid var(--c-border);}
.rw-date b{display:block;font-size:1.3rem;font-weight:800;line-height:1.1;color:var(--c-primary);}
.rw-date span{font-size:.72rem;color:var(--c-text-muted);}
.rw-time{flex:1;}
.rw-time span{display:block;font-size:.72rem;color:var(--c-text-muted);}
.rw-time b{font-size:.95rem;font-family:'JetBrains Mono',monospace;font-weight:600;}
.rw-ket{display:flex;flex-direction:column;align-items:flex-end;gap:4px;min-width:72px;}
.rw-ok{color:var(--c-text-muted);}
.rw-day{font-size:.8rem;font-weight:700;color:var(--c-primary);margin:16px 2px 8px;}
.rw-day:first-child{margin-top:0;}
.rw-log{display:flex;align-items:center;gap:12px;background:var(--c-surface);border-radius:var(--radius-sm);padding:10px 14px;margin-bottom:6px;box-shadow:var(--shadow);}
.rw-log-ico{width:34px;height:34px;flex:none;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:.85rem;}
.rw-log-txt{flex:1;min-width:0;}

.rw-log-detail{font-size:.76rem;color:var(--c-text-muted);overflow-wrap:anywhere;}

/* ─── TOOLTIP & REKAP KEHADIRAN ──────────────────────── */
.table-rekap-kehadiran{width:100%;min-width:980px;border-collapse:collapse;}
.table-rekap-kehadiran th{
  background:#f1f5f9!important;
  color:#1e293b!important;
  font-weight:700;
  font-size:.73rem;
  letter-spacing:.3px;
  padding:11px 8px;
  border-bottom:2px solid #cbd5e1!important;
  position:sticky;
  top:0;
  z-index:2;
  white-space:nowrap;
}
.th-tip{
  position:relative;
  cursor:help;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  border-bottom:1.5px dotted #64748b;
  padding-bottom:1px;
}
.th-tip::after{
  content:attr(data-tip);
  position:absolute;
  bottom:calc(100% + 8px);
  left:50%;
  transform:translateX(-50%) scale(.92);
  background:#0f172a;
  color:#ffffff;
  padding:6px 10px;
  border-radius:6px;
  font-size:.72rem;
  font-weight:600;
  white-space:nowrap;
  opacity:0;
  visibility:hidden;
  transition:all .18s cubic-bezier(.4,0,.2,1);
  pointer-events:none;
  z-index:1000;
  box-shadow:0 4px 14px rgba(15,23,42,.28);
  letter-spacing:normal;
  text-transform:none;
}
.th-tip::before{
  content:'';
  position:absolute;
  bottom:calc(100% + 2px);
  left:50%;
  transform:translateX(-50%);
  border:5px solid transparent;
  border-top-color:#0f172a;
  opacity:0;
  visibility:hidden;
  transition:all .18s cubic-bezier(.4,0,.2,1);
  pointer-events:none;
  z-index:1000;
}
.th-tip:hover::after{
  opacity:1;
  visibility:visible;
  transform:translateX(-50%) scale(1);
}
.th-tip:hover::before{
  opacity:1;
  visibility:visible;
}

</style>
