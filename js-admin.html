<script>
// Helper error standar halaman ADMIN: sesi habis → tendang ke login,
// gagal biasa → kartu error + tombol muat ulang (tidak pernah spinner polos).
function sesiHabisHTML() {
  toast('Sesi habis, silakan login kembali', 'warn');
  try { clearToken(); } catch(e) {}
  document.getElementById('page-body').innerHTML = `
    <div class="card" style="text-align:center;padding:40px 24px;">
      <i class="fas fa-key fa-2x" style="color:var(--c-warning);margin-bottom:12px;"></i>
      <div style="font-weight:800;margin-bottom:6px;">Sesi Berakhir</div>
      <div style="font-size:.82rem;color:var(--c-text-muted);margin-bottom:16px;">Silakan login kembali untuk melanjutkan.</div>
      <button class="btn btn-primary" onclick="location.reload()"><i class="fas fa-sign-in-alt"></i> Ke Halaman Login</button>
    </div>`;
}
function adminGagalHTML(judul, pesan, halaman) {
  return `
    <div class="card" style="text-align:center;padding:40px 24px;">
      <i class="fas fa-wifi fa-2x" style="color:var(--c-text-muted);margin-bottom:12px;"></i>
      <div style="font-weight:800;margin-bottom:6px;">${judul}</div>
      <div style="font-size:.82rem;color:var(--c-text-muted);margin-bottom:16px;">${escapeHtml(pesan || 'Server tidak merespons.')}</div>
      <button class="btn btn-primary" onclick="showPage('${halaman}')"><i class="fas fa-rotate-right"></i> Coba Lagi</button>
    </div>`;
}
// PAGE: DASHBOARD (ADMIN)
async function pageDashboard() {
  const d = await callGAS('getDashboardData');
  if (!d || !d.success) {
    if (d && d.message && /sesi|login|akses|admin/i.test(d.message)) return sesiHabisHTML();
    document.getElementById('page-body').innerHTML = adminGagalHTML('Gagal memuat dashboard', (d && d.message) || '', 'dashboard');
    toast('Gagal memuat dashboard: ' + ((d && d.message) || ''), 'error');
    return;
  }
  const pending = (d.pendingIzin || 0);
  document.getElementById('badge-approval').textContent = pending;
  if (pending === 0) document.getElementById('badge-approval').style.display = 'none';

  document.getElementById('page-body').innerHTML = `
    <div class="stat-grid" style="grid-template-columns:repeat(auto-fit,minmax(150px,1fr));">
      <div class="stat-card blue">
        <div class="stat-icon blue"><i class="fas fa-users"></i></div>
        <div class="stat-value">${d.totalGuru}</div>
        <div class="stat-label">Total Guru & Staff</div>
      </div>
      <div class="stat-card teal">
        <div class="stat-icon teal"><i class="fas fa-user-check"></i></div>
        <div class="stat-value">${d.hadirHari}</div>
        <div class="stat-label">Hadir Hari Ini</div>
      </div>
      <div class="stat-card yellow">
        <div class="stat-icon yellow"><i class="fas fa-clock"></i></div>
        <div class="stat-value">${d.terlambatHari || 0}</div>
        <div class="stat-label">Terlambat Hari Ini</div>
      </div>
      <div class="stat-card orange">
        <div class="stat-icon orange"><i class="fas fa-file-alt"></i></div>
        <div class="stat-value">${d.izinHari}</div>
        <div class="stat-label">Izin Hari Ini</div>
      </div>
      <div class="stat-card red">
        <div class="stat-icon red"><i class="fas fa-user-times"></i></div>
        <div class="stat-value">${d.tidakMasuk}</div>
        <div class="stat-label">Tidak Masuk</div>
      </div>
    </div>
    <div class="grid-2" style="margin-bottom:24px;">
      <div class="card">
        <div class="card-title"><i class="fas fa-chart-line"></i> Kehadiran 7 Hari Terakhir</div>
        <div class="chart-container"><canvas id="chart-hadir"></canvas></div>
      </div>
      <div class="card">
        <div class="card-title"><i class="fas fa-chart-pie"></i> Status Hari Ini</div>
        <div class="chart-container"><canvas id="chart-pie"></canvas></div>
      </div>
    </div>
    <div class="grid-2" style="margin-bottom:24px;">
      <div class="card">
        <div class="card-title"><i class="fas fa-user-clock"></i> Absen Masuk Hari Ini</div>
        <div class="table-wrap">
          <table>
            <tr><th>Nama</th><th>Waktu</th><th>Status</th><th>Lokasi</th></tr>
            ${(d.absenHariIni||[]).length ? d.absenHariIni.map(a=>`
              <tr><td>${a.nama}</td><td>${fmt(a.waktuMasuk,'HH:mm')}</td><td>${statusBadge(a.status)}</td><td>${a.lokasi||'—'}</td></tr>`).join('') : '<tr><td colspan="4" style="text-align:center;color:var(--c-text-muted);padding:16px;">Belum ada yang absen</td></tr>'}
          </table>
        </div>
      </div>
      <div class="card">
        <div class="card-title"><i class="fas fa-exclamation-triangle" style="color:var(--c-warning)"></i> Terlambat, Tidak Masuk & Izin</div>
        ${(d.detailTerlambat||[]).length ? `<div style="margin-bottom:12px;"><div class="text-xs font-bold" style="color:var(--c-warning);margin-bottom:6px;">TERLAMBAT (${(d.detailTerlambat||[]).length})</div>${(d.detailTerlambat||[]).map(u=>`<div style="padding:6px 0;border-bottom:1px solid var(--c-border);font-size:.83rem;display:flex;justify-content:space-between;align-items:center;"><span>${u.nama} <span style="color:var(--c-text-muted)">· ${u.mapel||'—'}</span></span><span class="badge badge-warning">${fmt(u.waktuMasuk,'HH:mm')}</span></div>`).join('')}</div>` : ''}
        ${d.detailTidakMasuk.length ? `<div style="margin-bottom:12px;"><div class="text-xs font-bold" style="color:var(--c-danger);margin-bottom:6px;">TIDAK MASUK</div>${d.detailTidakMasuk.map(u=>`<div style="padding:6px 0;border-bottom:1px solid var(--c-border);font-size:.83rem;display:flex;justify-content:space-between;"><span>${u.nama}</span><span style="color:var(--c-text-muted)">${u.mapel}</span></div>`).join('')}</div>` : ''}
        ${d.detailIzin.length ? `<div><div class="text-xs font-bold" style="color:var(--c-warning);margin-bottom:6px;">IZIN</div>${d.detailIzin.map(u=>`<div style="padding:6px 0;border-bottom:1px solid var(--c-border);font-size:.83rem;display:flex;justify-content:space-between;"><span>${u.nama}</span><span style="color:var(--c-text-muted)">${u.mapel}</span></div>`).join('')}</div>` : ''}
        ${!(d.detailTerlambat||[]).length && !d.detailTidakMasuk.length && !d.detailIzin.length ? '<div style="text-align:center;padding:20px;color:var(--c-text-muted);">Semua hadir 🎉</div>' : ''}
      </div>
    </div>
    ${pending > 0 ? `<div class="card" style="border-left:4px solid var(--c-warning);">
      <div style="display:flex;align-items:center;justify-content:space-between;">
        <div><i class="fas fa-bell" style="color:var(--c-warning)"></i> <strong>${pending} Persetujuan Menunggu</strong> <span style="font-size:.8rem;color:var(--c-text-muted);">(${d.pendingIzin} izin)</span></div>
        <button class="btn btn-warning btn-sm" onclick="showPage('approval')">Proses Sekarang</button>
      </div>
    </div>` : ''}`;

  setTimeout(() => {
    if (chartInstance) { chartInstance.destroy(); chartInstance = null; }
    const labels = (d.rekap7||[]).map(r => r.tanggal);
    const hadirData = (d.rekap7||[]).map(r => r.hadir);
    const ctx1 = document.getElementById('chart-hadir').getContext('2d');
    chartInstance = new Chart(ctx1, {
      type: 'bar',
      data: { labels, datasets: [{ label: 'Hadir', data: hadirData, backgroundColor: 'rgba(26,35,126,0.75)', borderRadius: 6, borderSkipped: false }] },
      options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } }, scales: { y: { beginAtZero: true, max: d.totalGuru || 20, grid: { color: 'rgba(0,0,0,.04)' } }, x: { grid: { display: false } } } }
    });
    const ctx2 = document.getElementById('chart-pie').getContext('2d');
    const telatHari = Number(d.terlambatHari || 0);
    const hadirTepat = Math.max(0, Number(d.hadirHari || 0) - telatHari);
    new Chart(ctx2, {
      type: 'doughnut',
      data: { labels: ['Tepat Waktu', 'Terlambat', 'Izin', 'Tidak Masuk'], datasets: [{ data: [hadirTepat, telatHari, d.izinHari, d.tidakMasuk], backgroundColor: ['#00897b', '#f57f17', '#3949ab', '#c62828'], borderWidth: 0, hoverOffset: 6 }] },
      options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { position: 'bottom', labels: { padding: 14, font: { size: 11 } } } }, cutout: '65%' }
    });
  }, 100);
}

// PAGE: APPROVAL (ADMIN)
async function pageApproval() {
  const res = await callGAS('getAllIzinKegiatan');
  if (!res || !res.success) {
    if (res && res.message && /sesi|login|akses|admin/i.test(res.message)) return sesiHabisHTML();
    document.getElementById('page-body').innerHTML = adminGagalHTML('Gagal memuat persetujuan', (res && res.message) || '', 'approval');
    toast('Gagal memuat data: ' + ((res && res.message) || ''), 'error');
    return;
  }
  const pendingIzin = (res.izin || []).filter(i => i.Status === 'MENUNGGU');
  const approvedIzin = (res.izin || []).filter(i => i.Status !== 'MENUNGGU').slice(-10).reverse();

  document.getElementById('page-body').innerHTML = `
    <div class="mb-3">
      <div class="card-title" style="margin-bottom:14px;"><i class="fas fa-file-alt" style="color:var(--c-warning)"></i> Pengajuan Izin (${pendingIzin.length})</div>
      <div class="pending-list">
        ${pendingIzin.length ? pendingIzin.map(i => `
          <div class="pending-card">
            <div class="pending-title">${i.Nama} — <span style="color:var(--c-primary)">${i.JenisIzin}</span></div>
            <div class="pending-meta">${fmt(i.TanggalMulai)} s/d ${fmt(i.TanggalSelesai)}</div>
            <div class="pending-meta" style="margin-top:4px;">${i.Keterangan||'—'}</div>
            <div class="pending-actions">
              <button class="btn btn-success btn-sm" onclick="prosesIzin('${i.ID}','DISETUJUI')"><i class="fas fa-check"></i> Setujui</button>
              <button class="btn btn-danger btn-sm" onclick="prosesIzin('${i.ID}','DITOLAK')"><i class="fas fa-times"></i> Tolak</button>
            </div>
          </div>`).join('') : '<div style="text-align:center;padding:24px;color:var(--c-text-muted);background:var(--c-surface);border-radius:var(--radius);">Tidak ada pengajuan izin</div>'}
      </div>
    </div>
    <div class="card">
      <div class="card-title"><i class="fas fa-check-double"></i> Riwayat Persetujuan Izin Terbaru</div>
      <div class="table-wrap">
        <table>
          <tr><th>Nama</th><th>Jenis</th><th>Periode</th><th>Status</th><th>Disetujui</th></tr>
          ${approvedIzin.length ? approvedIzin.map(i => `
            <tr><td>${i.Nama}</td><td>${i.JenisIzin}</td><td>${fmt(i.TanggalMulai)}-${fmt(i.TanggalSelesai)}</td><td>${statusBadge(i.Status)}</td><td>${fmt(i.WaktuPersetujuan,'DD/MM HH:mm')}</td></tr>`).join('') : '<tr><td colspan="5" style="text-align:center;padding:16px;color:var(--c-text-muted);">Belum ada riwayat</td></tr>'}
        </table>
      </div>
    </div>`;
}

async function prosesIzin(id, status) {
  showModal(`
    <h3>${status === 'DISETUJUI' ? '✅ Setujui Izin' : '❌ Tolak Izin'}</h3>
    <div class="form-group"><label class="form-label">Catatan (opsional)</label><textarea id="m-catatan" class="form-input" rows="3" placeholder="Tambahkan catatan..."></textarea></div>
    <div class="flex gap-2">
      <button class="btn ${status==='DISETUJUI'?'btn-success':'btn-danger'}" onclick="konfirmasiIzin('${id}','${status}')"><i class="fas fa-check"></i> Konfirmasi</button>
      <button class="btn btn-ghost" onclick="closeModal()">Batal</button>
    </div>`);
}
async function konfirmasiIzin(id, status) {
  const catatan = document.getElementById('m-catatan').value;
  const res = await callGAS('prosesIzin', id, status, catatan);
  toast(res.message, res.success ? 'success' : 'error');
  closeModal();
  if (res.success) showPage('approval');
}

async function prosesKegiatan(id, status) {
  showModal(`
    <h3>${status === 'DISETUJUI' ? '✅ Setujui Kegiatan' : '❌ Tolak Kegiatan'}</h3>
    <div class="form-group"><label class="form-label">Catatan (opsional)</label><textarea id="m-catatan2" class="form-input" rows="3" placeholder="Catatan..."></textarea></div>
    <div class="flex gap-2">
      <button class="btn ${status==='DISETUJUI'?'btn-success':'btn-danger'}" onclick="konfirmasiKegiatan('${id}','${status}')"><i class="fas fa-check"></i> Konfirmasi</button>
      <button class="btn btn-ghost" onclick="closeModal()">Batal</button>
    </div>`);
}
async function konfirmasiKegiatan(id, status) {
  const catatan = document.getElementById('m-catatan2').value;
  const res = await callGAS('prosesKegiatan', id, status, catatan);
  toast(res.message, res.success ? 'success' : 'error');
  closeModal();
  if (res.success) showPage('approval');
}

// [PINDAH] pageProfil + togglePassField + simpanProfil + simpanPassword sudah pindah ke
// js-user.html supaya menu Profil user tidak tergantung file admin.

// PAGE: DATA ABSENSI (ADMIN)
async function pageAdminAbsensi() {
  const now = new Date();
  const bulan = now.getMonth() + 1;
  const tahun = now.getFullYear();
  const res = await callGAS('getAllAbsensi', bulan, tahun);
  const data = (res.data || []).reverse();
  document.getElementById('page-body').innerHTML = `
    <div class="card mb-3" style="padding:16px;">
      <div class="flex gap-3 items-center flex-wrap">
        <div class="flex gap-2 items-center">
          <label class="form-label" style="margin:0">Bulan:</label>
          <select id="f-bulan" class="form-input" style="width:auto;padding:8px 12px;">
            ${Array.from({length:12},(_,i)=>`<option value="${i+1}" ${i+1===bulan?'selected':''}>${['Jan','Feb','Mar','Apr','Mei','Jun','Jul','Agu','Sep','Okt','Nov','Des'][i]}</option>`).join('')}
          </select>
        </div>
        <div class="flex gap-2 items-center">
          <label class="form-label" style="margin:0">Tahun:</label>
          <input type="number" id="f-tahun" class="form-input" value="${tahun}" style="width:90px;padding:8px;"/>
        </div>
        <button class="btn btn-primary btn-sm" onclick="filterAbsensi()"><i class="fas fa-filter"></i> Filter</button>
      </div>
    </div>
    <div class="card">
      <div class="card-title"><i class="fas fa-table"></i> Data Absensi</div>
      <div class="table-wrap" id="absensi-table">
        ${renderAbsensiTable(data)}
      </div>
    </div>`;
}

function renderAbsensiTable(data) {
  return `<table>
    <tr><th>Nama</th><th>Tanggal</th><th>Masuk</th><th>Pulang</th><th>Lokasi</th><th>Status Masuk</th><th>Status Pulang</th></tr>
    ${data.length ? data.map(a=>`
      <tr>
        <td>${a.Nama||'—'}</td>
        <td>${fmt(a.Tanggal)}</td>
        <td>${a.WaktuMasuk?fmt(a.WaktuMasuk,'HH:mm'):'—'}</td>
        <td>${a.WaktuPulang?fmt(a.WaktuPulang,'HH:mm'):'—'}</td>
        <td>${a.LokasiMasuk||'—'}</td>
        <td>${statusBadge(a.StatusMasuk)}</td>
        <td>${statusBadge(a.StatusPulang)}</td>
      </tr>`).join('') : '<tr><td colspan="7" style="text-align:center;padding:24px;color:var(--c-text-muted);">Tidak ada data</td></tr>'}
  </table>`;
}

async function filterAbsensi() {
  const bulan = document.getElementById('f-bulan').value;
  const tahun = document.getElementById('f-tahun').value;
  const res = await callGAS('getAllAbsensi', parseInt(bulan), parseInt(tahun));
  document.getElementById('absensi-table').innerHTML = renderAbsensiTable((res.data||[]).reverse());
}

// PAGE: REKAP KEHADIRAN (ADMIN)
async function pageRekap() {
  const now   = new Date();
  const bulan = now.getMonth() + 1;
  const tahun = now.getFullYear();

  document.getElementById('page-body').innerHTML = `
    <div class="card mb-3" style="padding:18px;">
      <div class="form-section-title" style="margin-bottom:14px;">
        <i class="fas fa-filter" style="color:var(--c-primary)"></i> Filter Rekap Kehadiran
      </div>
      <div class="flex gap-3 items-center flex-wrap">
        <div class="flex gap-2 items-center">
          <label class="form-label" style="margin:0;white-space:nowrap">Bulan:</label>
          <select id="rk-bulan" class="form-input" style="width:auto;padding:8px 12px;">
            ${Array.from({length:12},(_,i)=>`<option value="${i+1}" ${i+1===bulan?'selected':''}>${['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'][i]}</option>`).join('')}
          </select>
        </div>
        <div class="flex gap-2 items-center">
          <label class="form-label" style="margin:0;white-space:nowrap">Tahun:</label>
          <input type="number" id="rk-tahun" class="form-input" value="${tahun}" style="width:90px;padding:8px;"/>
        </div>
        <div class="flex gap-2 items-center">
          <label class="form-label" style="margin:0;white-space:nowrap">Hari Kerja:</label>
          <input type="number" id="rk-harikerja" class="form-input" value="26" min="1" max="31" style="width:70px;padding:8px;"/>
        </div>
        <button class="btn btn-primary btn-sm" onclick="loadRekapKehadiran()">
          <i class="fas fa-search"></i> Tampilkan
        </button>
        <button class="btn btn-success btn-sm" onclick="doExportRekap()" id="btn-export" style="display:none">
          <i class="fas fa-file-excel"></i> Export ke Spreadsheet
        </button>
        <button class="btn btn-accent btn-sm" onclick="downloadRekapCSV()" id="btn-csv" style="display:none">
          <i class="fas fa-file-csv"></i> Download CSV
        </button>
      </div>
      <div style="font-size:.75rem;color:var(--c-text-muted);margin-top:8px;">
        <i class="fas fa-info-circle"></i>
        <strong>Hari Kerja</strong> diisi manual sesuai kalender efektif.
      </div>
    </div>
    <div id="rekap-kehadiran-wrap">
      <div style="text-align:center;padding:48px;color:var(--c-text-muted);">
        <i class="fas fa-table fa-2x" style="margin-bottom:12px;display:block;opacity:.3"></i>
        Pilih bulan, tahun, dan hari kerja lalu klik <strong>Tampilkan</strong>
      </div>
    </div>`;
}

async function loadRekapKehadiran() {
  const bulan     = parseInt(document.getElementById('rk-bulan').value);
  const tahun     = parseInt(document.getElementById('rk-tahun').value);
  const hariKerja = parseInt(document.getElementById('rk-harikerja').value) || 0;

  const wrap = document.getElementById('rekap-kehadiran-wrap');
  wrap.innerHTML = '<div style="text-align:center;padding:40px;"><i class="fas fa-spinner fa-spin fa-2x"></i></div>';

  const res = await callGAS('getRekapKehadiran', bulan, tahun, hariKerja);
  if (!res || !res.success) {
    if (res && res.message && /sesi|login|akses|admin/i.test(res.message)) return sesiHabisHTML();
    wrap.innerHTML = adminGagalHTML('Gagal memuat rekap', (res && res.message) || '', 'rekap');
    toast('Gagal memuat rekap: ' + ((res && res.message)||''), 'error');
    return;
  }

  const BULAN_NAMA = ['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];
  const bulanNama  = BULAN_NAMA[bulan-1];
  const data = res.data || [];

  wrap.innerHTML = `
    <div class="card" style="overflow:hidden;">
      <div style="padding:16px 20px 10px;border-bottom:1px solid var(--c-border);">
        <div style="font-size:.7rem;color:var(--c-text-muted);text-transform:uppercase;letter-spacing:.5px;margin-bottom:4px;">Laporan Rekapitulasi Kehadiran Pegawai</div>
        <div style="font-weight:800;font-size:1rem;color:var(--c-primary)">${bulanNama} ${tahun}</div>
        <div style="font-size:.78rem;color:var(--c-text-muted);margin-top:2px;">Hari Kerja Efektif: <strong>${hariKerja} hari</strong> &nbsp;|&nbsp; Total Guru & Staff: <strong>${data.length} orang</strong> &nbsp;|&nbsp; 1 JP = 30 menit</div>
      </div>
      <div class="table-wrap" style="font-size:.76rem;">
        <table class="table-rekap-kehadiran">
          <thead>
            <tr>
              <th style="text-align:left;padding-left:14px;width:38px;">NO</th>
              <th style="text-align:left;">NAMA</th>
              <th style="text-align:left;">NIP/NIK</th>
              <th style="text-align:left;"><span class="th-tip" data-tip="Jenis Pendidik & Tenaga Kependidikan" title="Jenis Pendidik & Tenaga Kependidikan">JENIS PTK</span></th>
              <th style="text-align:center;"><span class="th-tip" data-tip="Hari Kerja Efektif" title="Hari Kerja Efektif">HK</span></th>
              <th style="text-align:center;"><span class="th-tip" data-tip="Total Hari Hadir" title="Total Hari Hadir">HDR</span></th>
              <th style="text-align:center;"><span class="th-tip" data-tip="Terlambat Masuk" title="Terlambat Masuk">TLT</span></th>
              <th style="text-align:center;"><span class="th-tip" data-tip="Pulang Cepat / Sebelum Waktunya" title="Pulang Cepat / Sebelum Waktunya">PCT</span></th>
              <th style="text-align:center;"><span class="th-tip" data-tip="Tanpa Keterangan / Alpha" title="Tanpa Keterangan / Alpha">TK</span></th>
              <th style="text-align:center;"><span class="th-tip" data-tip="Izin Sakit" title="Izin Sakit">ISK</span></th>
              <th style="text-align:center;"><span class="th-tip" data-tip="Izin Keperluan Keluarga / Pribadi" title="Izin Keperluan Keluarga / Pribadi">IKK</span></th>
              <th style="text-align:center;"><span class="th-tip" data-tip="Cuti Pegawai" title="Cuti Pegawai">CTI</span></th>
              <th style="text-align:center;"><span class="th-tip" data-tip="Penugasan Luar / Dinas" title="Penugasan Luar / Dinas">PLD</span></th>
              <th style="text-align:center;"><span class="th-tip" data-tip="Kegiatan Lainnya di Luar Kelas" title="Kegiatan Lainnya di Luar Kelas">KEG</span></th>
              <th style="text-align:center;"><span class="th-tip" data-tip="Total Jam Mengajar (JP)" title="Total Jam Mengajar (JP)">JP</span></th>
              <th style="text-align:center;width:90px;">DETAIL</th>
            </tr>
          </thead>
          <tbody>

function bukaModalDetailKehadiran(userId) {

  const BULAN_NAMA = ['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];

          <strong>${escapeHtml(r.nama)}</strong> &nbsp;·&nbsp; NIP: <span style="font-family:monospace;">${escapeHtml(r.nip || '—')}</span> &nbsp;·&nbsp; ${escapeHtml(r.mapel || '—')}
        </div>
      </div>
      <button class="btn btn-ghost btn-sm" onclick="closeModal()" style="border-radius:50%;width:32px;height:32px;padding:0;min-width:32px;" title="Tutup">

    <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px;background:var(--c-surface2);padding:10px 14px;border-radius:10px;border:1px solid var(--c-border);font-size:.78rem;">

function downloadRekapCSV() {
  const s = window._rekapState;
  if (!s || !s.data || !s.data.length) { toast('Tampilkan rekap dulu sebelum download!', 'warn'); return; }
  const BULAN_NAMA = ['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];
  const bulanNama  = BULAN_NAMA[s.bulan - 1];
  const judul = [['LAPORAN REKAPITULASI KEHADIRAN PEGAWAI'],[`Periode: ${bulanNama} ${s.tahun}`],[`Hari Kerja Efektif: ${s.hariKerja} hari`],[]];
  const headers = ['NO','NAMA','NIP/NIK','JENIS PTK','HARI KERJA','HADIR','TELAT','PULANG CEPAT','TANPA KET.','IZIN SAKIT','IZIN KELUARGA','CUTI','PENUGASAN LUAR','KEGIATAN','JAM MENGAJAR (JP)'];
  const rows = s.data.map(r => [r.no, r.nama, r.nip, r.mapel, r.hariKerja, r.hadir, r.telat, r.pulangCepat, r.alpha, r.izinSakit, r.izinKeluarga, r.cuti, r.penugasanLuar, r.totalKegiatan, r.totalJamMengajar]);
  const allRows = [...judul, headers, ...rows];
  const csvContent = allRows.map(row => row.map(cell => { const val = cell === undefined || cell === null ? '' : String(cell); return val.includes(',') || val.includes('"') || val.includes('\n') ? `"${val.replace(/"/g, '""')}"` : val; }).join(',')).join('\n');
  const BOM = '\uFEFF';
  const blob = new Blob([BOM + csvContent], { type: 'text/csv;charset=utf-8;' });
  const url  = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = `Rekap_Kehadiran_${bulanNama}_${s.tahun}.csv`;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
  toast('File CSV berhasil didownload!', 'success');
}

  const judul = [['REKAP JAM MENGAJAR GURU & STAFF'],[`Periode: ${bulanNama} ${s.tahun}`],[`1 JP = ${s.menitPerJP || 30} menit`],[]];

  const rows = s.data.map((r, i) => [i + 1, r.nip || '', r.nama, r.mapel || '', r.totalSesiBulan, r.totalJP]);
  const allRows = [...judul, headers, ...rows];
  const csvContent = allRows.map(row => row.map(cell => {
    const val = cell === undefined || cell === null ? '' : String(cell);
    return val.includes(',') || val.includes('"') || val.includes('\n') ? `"${val.replace(/"/g, '""')}"` : val;
  }).join(',')).join('\n');
  const BOM = '\uFEFF';
  const blob = new Blob([BOM + csvContent], { type: 'text/csv;charset=utf-8;' });
  const url  = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = `Rekap_Jam_Mengajar_${bulanNama}_${s.tahun}.csv`;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
  toast('File CSV berhasil didownload!', 'success');
}

function formatJamSesi(jamMulai, jamSelesai, durasiMenit, perJP, jpCount) {
  if (!jamMulai && !jamSelesai) return '—';
  const jm = String(jamMulai || '').trim().replace(':', '.');
  const js = String(jamSelesai || '').trim().replace(':', '.');
  const rentangJam = (jm && js) ? `${jm} - ${js}` : (jm || js || '—');
  if (!jamMulai) return rentangJam;

  const parts = String(jamMulai).split(/[:.]/);
  const m = (parseInt(parts[0], 10) || 0) * 60 + (parseInt(parts[1], 10) || 0);

  let startSesi = 1;
  if (m <= 465) startSesi = 1;        // <= 07:45 (sesi 1 mulai ~07.00 - 07.15)
  else if (m <= 510) startSesi = 2;   // 07:46 - 08:30
  else if (m <= 555) startSesi = 3;   // 08:31 - 09:15
  else if (m <= 600) startSesi = 4;   // 09:16 - 10:00
  else if (m <= 650) startSesi = 5;   // 10:01 - 10:50
  else if (m <= 700) startSesi = 6;   // 10:51 - 11:40
  else if (m <= 780) startSesi = 7;   // 11:41 - 13:00
  else if (m <= 825) startSesi = 8;   // 13:01 - 13:45
  else if (m <= 870) startSesi = 9;   // 13:46 - 14:30
  else if (m <= 915) startSesi = 10;  // 14:31 - 15:15
  else startSesi = Math.max(1, Math.floor((m - 420) / 45) + 1);

  let span = 1;
  if (jpCount && jpCount >= 1) {
    span = Math.round(jpCount);
  } else if (durasiMenit && durasiMenit > 0) {
    span = Math.max(1, Math.round(durasiMenit / (perJP || 45)));
  }

  const sesiLabel = (span <= 1) ? `Sesi ${startSesi}` : `Sesi ${startSesi}-${startSesi + span - 1}`;
  return `${rentangJam} / ${sesiLabel}`;
}

function formatTgl(iso) {
  if (!iso) return '—';
  const parts = iso.split('-');
  if (parts.length < 3) return iso;
  return parts[2] + '/' + parts[1] + '/' + parts[0];
}

async function loadRekapJam() {
  const bulan = parseInt(document.getElementById('rj-bulan').value);

  const res = await callGAS('getRekapJamMengajar', bulan, tahun);

  document.getElementById('rekap-jam-table').innerHTML = renderRekapJamTable(data, res.menitPerJP);

}

  try { res = await callGAS('resetDatabase', kode); }
  catch (e) { res = { success: false, message: 'Koneksi gagal: ' + e.message }; }
  if (btn) { btn.disabled = false; btn.innerHTML = '<i class="fas fa-trash-can"></i> Ya, Reset Sekarang'; }
  toast(res.message, res.success ? 'success' : 'error', 5000);
  if (res.success) {
    closeModal();
    if (res.detail && res.detail.length) toast(res.detail.join(' • '), 'info', 7000);
    showPage('dashboard'); // refresh angka dashboard yang kini nol
  }
}

// PAGE: MASTER DATA (ADMIN) — Kelas & Mata Pelajaran
const MASTER_TABS = [
  { jenis: 'Kelas',    label: 'Kelas',           icon: 'fa-school',        contoh: 'Contoh: 3A' },
  { jenis: 'Mapel',    label: 'Mata Pelajaran',  icon: 'fa-book',          contoh: 'Contoh: Aqidah Akhlak' },
  { jenis: 'Kegiatan', label: 'Kegiatan',        icon: 'fa-calendar-check', contoh: 'Contoh: Pramuka' }
];
let masterState = { tab: 'Kelas', data: { Kelas: [], Mapel: [], Kegiatan: [] }, sibuk: false };
const MASTER_NAMA = { Kelas: 'Kelas', Mapel: 'Mata Pelajaran', Kegiatan: 'Kegiatan' };

function mEsc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]));
}

async function pageMaster() {
  masterState.tab = 'Kelas';
  masterState.sibuk = false;
  await muatMaster();
}

async function muatMaster() {
  const res = await callGAS('getMasterData');
  if (!res || !res.success) {
    if (res && res.message && /sesi|login|akses|admin/i.test(res.message)) return sesiHabisHTML();
    document.getElementById('page-body').innerHTML = adminGagalHTML('Gagal memuat Master Data', (res && res.message) || '', 'master');
    toast('Gagal memuat Master Data: ' + ((res && res.message) || ''), 'error');
    return;
  }
  masterState.data = { Kelas: res.kelas || [], Mapel: res.mapel || [], Kegiatan: res.kegiatan || [] };
  renderMaster();
}

function setMasterTab(t) { masterState.tab = t; renderMaster(); }

function renderMaster() {
  const body = document.getElementById('page-body');
  if (!body) return;
  const t = masterState.tab, list = masterState.data[t], nama = MASTER_NAMA[t];
  const info = MASTER_TABS.find(x => x.jenis === t);
  const dipakaiDi = t === 'Kelas' || t === 'Mapel' ? 'form Laporan Mengajar' : 'form Kegiatan';
  body.innerHTML = `
    <div class="rw-tabs" style="max-width:620px;">
      ${MASTER_TABS.map(x => `<button class="rw-tab ${t === x.jenis ? 'active' : ''}" onclick="setMasterTab('${x.jenis}')"><i class="fas ${x.icon}"></i> ${x.label} (${masterState.data[x.jenis].length})</button>`).join('')}
    </div>
    <div class="card mb-3">
      <div class="card-title"><i class="fas fa-plus-circle"></i> Tambah ${nama}</div>
      <div class="flex gap-2 items-center flex-wrap">
        <input type="text" id="mst-nama" class="form-input" style="flex:1;min-width:200px;" maxlength="50" placeholder="${info.contoh}" onkeydown="if(event.key==='Enter')tambahMasterItem()"/>
        <button class="btn btn-primary" id="btn-mst-tambah" onclick="tambahMasterItem()"><i class="fas fa-plus"></i> Tambah</button>
      </div>
      <div style="font-size:.75rem;color:var(--c-text-muted);margin-top:8px;">
        ${!list.length
          ? `Daftar masih kosong: guru sementara bisa mengetik ${nama.toLowerCase()} secara bebas. Setelah ada isinya, guru hanya bisa memilih dari daftar ini.`
          : `Daftar ini otomatis menjadi pilihan dropdown di ${dipakaiDi} guru.`}
      </div>
    </div>
    <div class="card">
      <div class="card-title"><i class="fas fa-list"></i> Daftar ${nama}</div>
      <div class="table-wrap">
        <table>
          <tr><th style="width:50px">No</th><th>Nama</th><th style="width:150px">Aksi</th></tr>
          ${list.length ? list.map((m, i) => `
            <tr>
              <td>${i + 1}</td>
              <td><strong>${mEsc(m.nama)}</strong></td>
              <td><div class="flex gap-2">
                <button class="btn btn-ghost btn-sm" onclick="modalUbahMaster('${m.id}')" title="Ubah"><i class="fas fa-edit"></i></button>
                <button class="btn btn-danger btn-sm" onclick="modalHapusMaster('${m.id}')" title="Hapus"><i class="fas fa-trash"></i></button>
              </div></td>
            </tr>`).join('') : `<tr><td colspan="3" style="text-align:center;padding:24px;color:var(--c-text-muted);">Belum ada ${nama.toLowerCase()}</td></tr>`}
        </table>
      </div>
    </div>`;
}

function cariMaster(id) { return masterState.data[masterState.tab].find(x => x.id === id); }

async function tambahMasterItem() {
  if (masterState.sibuk) return;
  const inp = document.getElementById('mst-nama');
  const nama = inp ? inp.value.trim() : '';
  if (!nama) { toast('Isi nama terlebih dahulu!', 'warn'); return; }
  masterState.sibuk = true;
  const btn = document.getElementById('btn-mst-tambah');
  if (btn) { btn.disabled = true; btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Menyimpan...'; }
  let res;
  try { res = await callGAS('tambahMaster', masterState.tab, nama); }
  catch (e) { res = { success: false, message: 'Koneksi gagal. Muat ulang halaman lalu cek daftar.' }; }
  masterState.sibuk = false;
  toast(res.message, res.success ? 'success' : 'error');
  if (res.success) await muatMaster();
  else if (btn) { btn.disabled = false; btn.innerHTML = '<i class="fas fa-plus"></i> Tambah'; }
}

function modalUbahMaster(id) {
  const m = cariMaster(id);
  if (!m) return;
  showModal(`
    <h3><i class="fas fa-edit"></i> Ubah ${MASTER_NAMA[masterState.tab]}</h3>
    <div class="form-group"><label class="form-label">Nama</label>
      <input type="text" id="mst-edit" class="form-input" maxlength="50" value="${mEsc(m.nama)}" onkeydown="if(event.key==='Enter')simpanUbahMaster('${m.id}')"/></div>
    <div style="font-size:.78rem;color:var(--c-text-muted);margin-bottom:14px;">Laporan yang sudah tersimpan tidak berubah; nama baru berlaku untuk laporan berikutnya.</div>
    <div class="flex gap-2">
      <button class="btn btn-primary" id="btn-mst-simpan" onclick="simpanUbahMaster('${m.id}')"><i class="fas fa-save"></i> Simpan</button>
      <button class="btn btn-ghost" onclick="closeModal()">Batal</button>
    </div>`);
}

async function simpanUbahMaster(id) {
  if (masterState.sibuk) return;
  const nama = (document.getElementById('mst-edit').value || '').trim();
  if (!nama) { toast('Nama tidak boleh kosong!', 'warn'); return; }
  masterState.sibuk = true;
  const btn = document.getElementById('btn-mst-simpan');
  if (btn) { btn.disabled = true; btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Menyimpan...'; }
  let res;
  try { res = await callGAS('ubahMaster', id, nama); }
  catch (e) { res = { success: false, message: 'Koneksi gagal. Muat ulang halaman lalu cek daftar.' }; }
  masterState.sibuk = false;
  toast(res.message, res.success ? 'success' : 'error', 4500);
  if (res.success) { closeModal(); await muatMaster(); }
  else if (btn) { btn.disabled = false; btn.innerHTML = '<i class="fas fa-save"></i> Simpan'; }
}

function modalHapusMaster(id) {
  const m = cariMaster(id);
  if (!m) return;
  showModal(`
    <h3> Hapus ${MASTER_NAMA[masterState.tab]}</h3>
    <p style="color:var(--c-text-muted);margin-bottom:8px;">Yakin ingin menghapus <strong>${mEsc(m.nama)}</strong>?</p>
    <p style="font-size:.78rem;color:var(--c-text-muted);margin-bottom:16px;">Item ini hilang dari pilihan guru. Laporan yang sudah tersimpan tidak berubah.</p>
    <div class="flex gap-2">
      <button class="btn btn-danger" id="btn-mst-hapus" onclick="konfirmasiHapusMaster('${m.id}')"><i class="fas fa-trash"></i> Hapus</button>
      <button class="btn btn-ghost" onclick="closeModal()">Batal</button>
    </div>`);
}

async function konfirmasiHapusMaster(id) {
  if (masterState.sibuk) return;
  masterState.sibuk = true;
  const btn = document.getElementById('btn-mst-hapus');
  if (btn) { btn.disabled = true; btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Menghapus...'; }
  let res;
  try { res = await callGAS('hapusMaster', id); }
  catch (e) { res = { success: false, message: 'Koneksi gagal. Muat ulang halaman lalu cek daftar.' }; }
  masterState.sibuk = false;
  toast(res.message, res.success ? 'success' : 'error', 4500);
  closeModal();
  if (res.success) await muatMaster();
}
</script>
